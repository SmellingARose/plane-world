<style>
/* Layout: a single engineering-note column; diagrams break out wider in their own scroll boxes. */

}

  --accent: #6aa3ff; --accent-soft: #1b2b45; --warm: #f0955c; --warm-soft: #3a2518; --ok: #6fcf97; --ok-soft: #173022; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f141b; --panel: #161d27; --ink: #e6ebf2; --muted: #9aa6b6; --rule: #2a3442;
  --accent: #6aa3ff; --accent-soft: #1b2b45; --warm: #f0955c; --warm-soft: #3a2518; --ok: #6fcf97; --ok-soft: #173022; color-scheme: dark }
body { background: var(--bg); color: var(--ink); font: 15px/1.6 var(--body); }
.wrap { max-width: 980px; margin: 0 auto; padding-block: 40px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.diagram svg { display: block; min-width: 860px; width: 100%; height: auto; }
.diagram text { font-family: var(--body); fill: var(--ink); }
.diagram .mono { font-family: var(--mono); }
.diagram .sub { fill: var(--muted); font-size: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-top: 16px; }
.card { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card.pick { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }

.pill.warm { background: var(--warm-soft); color: var(--warm); }
ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }

.tablebox { overflow-x: auto; margin-top: 16px; background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; }

.note { color: var(--muted); font-size: 13px; }
.risk { display: grid; grid-template-columns: 8px 1fr; gap: 0 14px; }
.risk .bar { border-radius: 4px; background: var(--warm); }
.risk.mid .bar { background: color-mix(in srgb, var(--warm) 55%, var(--rule)); }
.risk .body { display: flex; flex-direction: column; gap: 4px; padding-block: 2px; min-width: 0; }
.risks { display: flex; flex-direction: column; gap: 16px; margin-top: 16px; }
.phases { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-top: 16px; }
.phase { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }

.sources { font-size: 13px; color: var(--muted); }
.sources a { color: var(--accent); }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }


.wrap { max-width: 980px; }
[hidden] { display: none !important; }
.mock { font: 500 11px/1 var(--mono); color: var(--warm); border: 1px dashed var(--warm); border-radius: 6px; padding: 5px 8px; align-self: flex-start; }
.methods { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; margin-top: 14px; }
.m { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 6px; text-align: left; font: inherit; color: var(--ink); }
.m .n { font: 600 16px/1.2 var(--display); }

.steps { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 18px; }
.st { padding: 10px; border-radius: 8px; background: var(--panel); border: 1px solid var(--rule); font: 500 12px/1.2 var(--mono); color: var(--muted); display: flex; gap: 8px; align-items: center; min-width: 0; }
.st b { width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; background: var(--rule); color: var(--ink); flex: none; font-weight: 600; }
.st { cursor: pointer; } .st:hover { border-color: var(--accent); }
.st.cur { border-color: var(--accent); color: var(--ink); } .st.cur b { background: var(--accent); color: var(--panel); }
.st.ok { color: var(--ok); } .st.ok b { background: var(--ok); color: var(--panel); }

.eq { overflow-x: auto; padding: 10px 12px; background: var(--bg); border-radius: 8px; }

summary { cursor: pointer; font-weight: 600; font-size: 14px; }
details p { font-size: 14px; margin-top: 6px; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }

button.b.pri { background: var(--accent); color: var(--panel); border-color: var(--accent); }
button.b:disabled { opacity: .45; cursor: not-allowed; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.pool, .slots { display: flex; flex-wrap: wrap; gap: 8px; min-height: 44px; padding: 8px; border-radius: 8px; }
.pool { background: var(--bg); } .slots { border: 1px dashed var(--rule); counter-reset: s; }

.fb { font-size: 14px; min-height: 20px; } .fb.good { color: var(--ok); } .fb.bad { color: var(--warm); }
canvas.sim { width: 100%; max-width: 760px; aspect-ratio: 160/64; border-radius: 8px; background: var(--bg); image-rendering: auto; }
.row { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; font-size: 14px; }
.par { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 16px; }
@media (max-width: 720px) { .par { grid-template-columns: 1fr; } }
.mem { font: 12px/1.4 var(--mono); display: grid; grid-template-columns: repeat(16, 1fr); gap: 2px; }

.q { display: flex; flex-direction: column; gap: 6px; padding: 10px 0; border-top: 1px solid var(--rule); }
.q .opt { text-align: left; }
.q .opt.right { border-color: var(--ok); background: var(--ok-soft); }
.q .opt.wrong { border-color: var(--warm); background: var(--warm-soft); }
.unlock { display: flex; gap: 14px; align-items: center; background: var(--ok-soft); border-radius: 10px; padding: 14px 16px; }
.unlock .big { font: 700 26px var(--display); color: var(--ok); }
:root { --c-f: #2563eb; --c-eq: #e0611a; --c-c: #0f9a6c; --c-tau: #7c3aed; --c-u: #d1307a; --c-rho: #0e7f99; --c-w: #64748b; --c-cs: #b07d06; --c-nu: #d23a3a; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --c-f: #6ea2ff; --c-eq: #ff9a55; --c-c: #3fd39c; --c-tau: #b494ff; --c-u: #ff7ab8; --c-rho: #4fd0ea; --c-w: #93a1b5; --c-cs: #e8bb3e; --c-nu: #ff7a7a; } }
:root[data-theme="dark"] { --c-f: #6ea2ff; --c-eq: #ff9a55; --c-c: #3fd39c; --c-tau: #b494ff; --c-u: #ff7ab8; --c-rho: #4fd0ea; --c-w: #93a1b5; --c-cs: #e8bb3e; --c-nu: #ff7a7a; }
.lede { font-size: 15px; }
.blk { display: flex; flex-direction: column; gap: 14px; padding: 18px; border: 1px solid var(--rule); border-radius: 14px; }
.bh { display: flex; gap: 12px; align-items: center; }
.bn { width: 30px; height: 30px; border-radius: 8px; background: var(--ink); color: var(--panel); display: grid; place-items: center; font: 600 15px var(--display); flex: none; }
.bh h4 { margin: 0; font: 600 18px/1.1 var(--display); }
.bh .note { font-size: 12.5px; }
.eqhero { overflow-x: auto; padding: 20px 12px; background: var(--bg); border-radius: 12px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.eqhero math { font-size: 1.6em; }
.eqhero math.sm { font-size: 1.3em; }
.bb { display: grid; grid-template-columns: minmax(0,1.65fr) minmax(220px,1fr); gap: 18px; align-items: start; }

.viz { margin: 0; display: flex; flex-direction: column; gap: 8px; }

.ctl3 { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 12px; align-items: center; font: 500 13px var(--mono); }
.ctl3 input { accent-color: var(--c-u); } .ctl3 output { min-width: 5ch; text-align: right; }

.sym { font: italic 600 19px/1 "STIX Two Math", "Cambria Math", "Times New Roman", serif; }
.insp { display: flex; flex-direction: column; gap: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 500 17px/1 "STIX Two Math", "Cambria Math", "Times New Roman", serif; color: var(--tc); background: color-mix(in srgb, var(--tc) 9%, var(--panel)); border: 1px solid color-mix(in srgb, var(--tc) 30%, transparent); border-radius: 9px; padding: 8px 10px; min-width: 40px; }

.def { display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: 12px; border-left: 4px solid var(--tc); background: color-mix(in srgb, var(--tc) 7%, var(--panel)); min-height: 96px; transition: border-color .15s, background-color .15s; }
.def .ds { font: italic 600 24px/1.1 "STIX Two Math", "Cambria Math", "Times New Roman", serif; color: var(--tc); }
.def b { font: 600 15px/1.3 var(--display); }
.def p { font-size: 13.5px; color: var(--muted); margin-top: 4px; }
.def.empty .ds { opacity: .45; }
[data-t] { cursor: pointer; transition: color .12s, background-color .12s; }
math .hl { background: color-mix(in srgb, currentColor 17%, transparent); border-radius: 4px; }
.blk details { border-top: 0; padding-top: 0; }
.blk summary { font-size: 13px; color: var(--muted); }
canvas.sim { max-width: 760px; }
.deep { display: flex; flex-direction: column; gap: 8px; }
.dstep { display: grid; grid-template-columns: 26px minmax(0,1fr); gap: 4px 12px; align-items: center; padding: 10px 14px; background: var(--bg); border-radius: 10px; }
.dstep .k { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font: 600 12px var(--mono); background: var(--panel); border: 1px solid var(--rule); }
.dstep .dm { overflow-x: auto; } .dstep .dm math { font-size: 1.18em; }
.dstep p { grid-column: 2; font-size: 13.5px; color: var(--muted); max-width: none; }
.bq { display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border-radius: 10px; border: 1px dashed var(--rule); }

.bq.done { border-color: var(--ok); border-style: solid; }
.bq .q, #quiz .q { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 8px; padding: 12px 0; }
.bq .q strong, .bq .q .fb, #quiz .q strong, #quiz .q .fb { flex-basis: 100%; }
.bq .q .opt, #quiz .q .opt { padding: 7px 12px; font-size: 13.5px; }
.q .fb:empty { display: none; }
#quiz .q:first-child { border-top: 0; }
.def .sp { display: flex; flex-direction: column; gap: 4px; padding-top: 8px; border-top: 1px solid color-mix(in srgb, var(--tc) 25%, transparent); overflow-x: auto; }
.def .sp:empty { display: none; }
.def .sp math { font-size: .95em; }
.dims { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.dim { display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border-radius: 10px; background: var(--bg); }
.dim b { font: 600 13px var(--display); } .dim math { font-size: 1.15em; } .dim span { font-size: 12.5px; color: var(--muted); }
.pipe { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px; padding: 14px; background: var(--bg); border-radius: 12px; }

.vec i { width: 14px; height: 14px; border-radius: 3px; background: var(--vc); }
.op { display: flex; flex-direction: column; align-items: center; font-size: 11.5px; color: var(--muted); padding: 0 4px; }
.op .ar { font-size: 22px; line-height: 1; color: var(--ink); }
.blk { gap: 0; }
.blk .bbody { display: flex; flex-direction: column; gap: 14px; padding-top: 14px; }

.bh { cursor: pointer; user-select: none; }
.bh > div { flex: 1; }
.bh .chev { font-size: 16px; color: var(--muted); transition: transform .2s; }

details.deep { display: flex; flex-direction: column; gap: 8px; }

.ir { display: contents; }

.opctl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.opcap { font-size: 14px; min-height: 3.2em; max-width: none; }

.eterms { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; align-items: center; font-size: 13.5px; }

.eterms span:nth-child(even) { color: var(--muted); }
.eex { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font: 500 13px var(--mono); }
.eex .b { padding: 5px 10px; font-size: 12.5px; }
.ecalc { font: 500 13.5px/1.6 var(--mono); }
.how { display: flex; flex-direction: column; gap: 10px; padding-top: 10px; border-top: 1px solid color-mix(in srgb, var(--tc) 25%, transparent); }
.how:empty { display: none; }
.how .eyebrow { color: var(--tc); }

.bh { padding: 2px 0; }

.lk { width: 13px; height: 13px; fill: var(--muted); stroke: var(--muted); stroke-width: 1.4; }

</style>

<div class="wrap">
  <header class="head">
    <span class="mock">Testing: click any step tab to jump</span>
    <h1>CFD solvers: earn the comparison</h1>
    <p>Each method unlocks its row in the comparison only after you learn the maths, build it, see how it runs in parallel, and pass a short quiz.</p>
  </header>
  <section id="home">
    <h2>Methods</h2>
    <div class="methods" id="methods"></div>
    <p class="note" id="progress" style="margin-top:10px"></p>

  <div id="courses"></div>

<script>
// CFD course framework: the home grid, the five-step course shell, the symbol inspector,
// the accordion of Learn blocks, the quizzes and the animation loop. Each method is a module

// velocity at (x,y,z) induced by a unit source density on panel j (j ≠ the panel the point sits on)
function infl(M, j, x, y, z, o){

function velRow(M, sig, U, i, out){ const N = M.N, C = M.C, x = C[i*3], y = C[i*3+1], z = C[i*3+2];

function luCol(A, N, b, k){ let p = k, mx = Math.abs(A[k*N+k]);

const nrm = v => { let s = 0; for (let i=0;i<v.length;i++) s += v[i]*v[i]; return Math.sqrt(s); };
function gmInit(A, N, b, tol){ const beta = nrm(b), v0 = new Float64Array(N); for (let i=0;i<N;i++) v0[i] = b[i]/beta;

// exact answer (Lamb 1932, §114): on an ellipsoid in a stream along x the surface velocity is the tangential part of k·U∞,
// k = 2/(2 − α₀), α₀ = abc ∫₀^∞ dλ / ((a²+λ)√((a²+λ)(b²+λ)(c²+λ))). Sphere: α₀ = 2/3, k = 3/2 → Cp = 1 − (9/4) sin²θ.
function ellK(a, b, c){ let s = 0; const M = 6000;

function system(n, ax){ const M = prep(mesh(n, ax)), N = M.N, A = new Float64Array(N*N), b = new Float64Array(N);
  for (let i=0;i<N;i++){ assembleRow(M, A, i); b[i] = -M.Nn[i*3]; } return {M, N, A, b}; }

// The Build job: assemble → solve → velocity → Cp, in small units so the browser can spread it over frames
function makeJob(n, body, solver){

    let gx = px/ax; const G = Math.hypot(gx, py, pz); gx /= G; th[i] = Math.acos(Math.max(-1, Math.min(1, gx))); cpx[i] = 1 - kf*kf*(1-gx*gx); }

// The 6-panel "sphere" (a cube) used for the operator walkthrough and the worked examples: every number is computed here
const CUBE = (() => {
  const nm = ['+x','−x','+y','−y','+z','−z'], C = [], S = 4;

  grad: {sym: '<msub><mo>∂</mo><mi>α</mi></msub>', name: 'Partial derivative', def: 'Rate of change along axis α. Applied to φ it gives the three velocity components.', space: '<msub><mo>∂</mo><mi>α</mi></msub><mo>:</mo><mtext>scalar field</mtext><mo>→</mo><mtext>vector field</mtext><mspace width=".4em"/><mtext>(linear)</mtext>', col: '--ink'},

   ['You average over a window shorter than the life of the big eddies. What happens?', ['The mean still wanders and the Reynolds stresses are noisy', 'Nothing; any window works', 'The flow becomes laminar'], 0, 'The error of a time average falls like 1/√(number of independent samples). Too short a window leaves the mean wandering, as the N_s slider shows.'],

 parallel: { html: `<div class="par">
  <div class="stack">
   <p><strong>Implicit and nonlinear.</strong> Each iteration solves J Δq = −R: a sparse system with 6 unknowns per cell, coupled to its 6 face neighbours. It is solved by a Krylov method (GMRES, BiCGStab) with an algebraic multigrid (AMG) or ILU preconditioner.</p>
   <p><strong>Domain decomposition.</strong> The mesh is cut into P parts, one per core or GPU. Each part keeps a one-cell <em>halo</em> copy of its neighbours’ edge cells and exchanges it before every matrix–vector product.</p>
   <p><strong>Global reductions.</strong> Every Krylov iteration needs dot products, and every outer iteration a residual norm: sums over <em>all</em> cells, so every rank waits for every other (an all-reduce, about log₂P network hops).</p>
  </div>
  <canvas id="rans-part" data-w="340" data-h="270" style="width:100%;max-width:340px;border-radius:8px;background:var(--bg)" aria-label="A cubic mesh cut into P parts; one part and its halo of ghost cells are highlighted"></canvas>
 </div>
 <h3 style="font-size:16px">Cut the mesh: halo against interior</h3>
 <p>Split a cube of cells into P parts and watch the surface-to-volume ratio: compute shrinks like 1/P, but halos shrink slower and the all-reduce gets <em>longer</em>. Find where communication costs more than computing.</p>
 <div class="ctl"><label for="rans-P">P</label><input type="range" id="rans-P" min="0" max="15" step="1" value="3"><output id="rans-Pv">8</output></div>
 <div class="ctl"><label for="rans-mesh">mesh</label><input type="range" id="rans-mesh" min="0" max="3" step="1" value="1"><output id="rans-meshv">64³</output></div>
 <div class="scrollx"><canvas id="rans-ptime" data-w="680" data-h="170" style="width:100%;border-radius:8px;background:var(--bg)" aria-label="Time per Krylov iteration split into compute, halo exchange and all-reduce, and the strong-scaling curve"></canvas></div>
 <div class="fb" id="rans-pfb"></div>
 <p class="note">Cost model (assumed, typical orders of magnitude): 0.5 µs of compute per cell per Krylov iteration, 2 µs latency per message or reduction hop, 10 GB/s links, 6 unknowns × 8 bytes per halo cell, 2 global reductions per iteration.</p>
 <details><summary>Further: why multigrid gets hard in parallel</summary><p>AMG builds ever coarser grids; on the coarse levels each rank owns only a handful of cells, so the levels become pure communication. Codes agglomerate coarse levels onto fewer ranks or switch to a direct solve there. Steady solvers also need many outer iterations, each with its own residual all-reduce; GPU implementations (e.g. matrix-free Newton–Krylov) cut memory traffic but keep the same global sums.</p></details>` },

 terms: {
  q: { sym: '<mi>q</mi>', name: 'State', def: 'Everything stored per cell: mean velocity ū_x, ū_y, ū_z, mean pressure p̄, and the model’s k and ω. No time index: the answer is one steady field.', space: `<msub><mi>q</mi><mrow><mi>a</mi><mi>x</mi><mi>y</mi><mi>z</mi></mrow></msub><mo>∈</mo><msup><mi>ℝ</mi><mrow><mn>6</mn><mo>×</mo><msub><mi>N</mi><mi>x</mi></msub><mo>×</mo><msub><mi>N</mi><mi>y</mi></msub><mo>×</mo><msub><mi>N</mi><mi>z</mi></msub></mrow></msup>`, col: '--c-f', op: 'I' },
  a: { sym: '<mi>a</mi>', name: 'Variable index', def: 'Which of the 6 unknowns: 0–2 = ū_x, ū_y, ū_z; 3 = p̄; 4 = k; 5 = ω.', space: '<mi>a</mi><mo>∈</mo><mo>{</mo><mn>0</mn><mo>,</mo><mo>…</mo><mo>,</mo><mn>5</mn><mo>}</mo>', col: '--c-f' },
  ix: { sym: '<mi>x</mi>', name: 'Cell column', def: 'Which column of the mesh, 0 … Nₓ−1. As a subscript of q it picks the cell.', space: '<mi>x</mi><mo>∈</mo><mo>{</mo><mn>0</mn><mo>,</mo><mo>…</mo><mo>,</mo><msub><mi>N</mi><mi>x</mi></msub><mo>−</mo><mn>1</mn><mo>}</mo>', col: '--ink' },
  iy: { sym: '<mi>y</mi>', name: 'Cell row', def: 'Which row, 0 … N_y−1 (away from the wall in the channel).', space: '<mi>y</mi><mo>∈</mo><mo>{</mo><mn>0</mn><mo>,</mo><mo>…</mo><mo>,</mo><msub><mi>N</mi><mi>y</mi></msub><mo>−</mo><mn>1</mn><mo>}</mo>', col: '--ink' },
  iz: { sym: '<mi>z</mi>', name: 'Cell layer', def: 'Which layer, 0 … N_z−1 (across the span).', space: '<mi>z</mi><mo>∈</mo><mo>{</mo><mn>0</mn><mo>,</mo><mo>…</mo><mo>,</mo><msub><mi>N</mi><mi>z</mi></msub><mo>−</mo><mn>1</mn><mo>}</mo>', col: '--ink' },
  N: { sym: '<msub><mi>N</mi><mi>x</mi></msub><mo>,</mo><msub><mi>N</mi><mi>y</mi></msub><mo>,</mo><msub><mi>N</mi><mi>z</mi></msub>', name: 'Mesh size', def: 'Cells along x, y and z. RANS meshes are coarse away from walls (the mean flow is smooth) and very fine next to them.', space: '<msub><mi>N</mi><mi>x</mi></msub><mo>,</mo><msub><mi>N</mi><mi>y</mi></msub><mo>,</mo><msub><mi>N</mi><mi>z</mi></msub><mo>∈</mo><mi>ℕ</mi>', col: '--ink' },
  t: { sym: '<mi>t</mi>', name: 'Physical time', def: 'Real time. It lives only inside the average and disappears: the steady RANS state has no t. (The t in ν_t means turbulent.)', space: '<mi>t</mi><mo>∈</mo><mo>[</mo><mn>0</mn><mo>,</mo><mi>T</mi><mo>]</mo><mo>⊂</mo><mi>ℝ</mi>', col: '--c-w' },
  T: { sym: '<mi>T</mi>', name: 'Averaging window', def: 'How long the average runs. It must be much longer than the slowest eddy, or the mean keeps wandering.', space: '<mi>T</mi><mo>∈</mo><msub><mi>ℝ</mi><mrow><mo>&gt;</mo><mn>0</mn></mrow></msub>', col: '--c-w', op: 'A' },
  s: { sym: '<mi>s</mi>', name: 'Sample index', def: 'Numbers the N_s readings a discrete time average adds up.', space: '<mi>s</mi><mo>∈</mo><mo>{</mo><mn>1</mn><mo>,</mo><mo>…</mo><mo>,</mo><msub><mi>N</mi><mi>s</mi></msub><mo>}</mo>', col: '--c-w', op: 'A' },
  n: { sym: '<mi>n</mi>', name: 'Iteration index', def: 'Counts steady iterations 0, 1, 2, … It is not time: the states on the way mean nothing, only the converged one. As a superscript (qⁿ) it is a label, not a power.', space: '<mi>n</mi><mo>∈</mo><mi>ℕ</mi>', col: '--c-w', op: 'I' },
  ij: { sym: '<mrow><mi>i</mi><mo>,</mo><mi>j</mi></mrow>', name: 'Axis indices', def: 'x, y or z. An index repeated in one term is summed over all three (Einstein convention).', space: '<mi>i</mi><mo>,</mo><mi>j</mi><mo>∈</mo><mo>{</mo><mi>x</mi><mo>,</mo><mi>y</mi><mo>,</mo><mi>z</mi><mo>}</mo>', col: '--ink' },
  u: { sym: '<msub><mi>u</mi><mi>i</mi></msub>', name: 'Instantaneous velocity', def: 'What a probe measures at one instant. In turbulence it jumps around by tens of percent.', space: '<msub><mi>u</mi><mi>i</mi></msub><mo>(</mo><mi>𝐱</mi><mo>,</mo><mi>t</mi><mo>)</mo><mo>∈</mo><mi>ℝ</mi><mo>,</mo><mspace width=".5em"/><mi>u</mi><mo>:</mo><msup><mi>ℝ</mi><mn>3</mn></msup><mo>×</mo><mi>ℝ</mi><mo>→</mo><msup><mi>ℝ</mi><mn>3</mn></msup>', col: '--c-f' },
  ub: { sym: `<msub>${bar('u')}<mi>i</mi></msub>`, name: 'Mean velocity', def: 'The time average of uᵢ: smooth and steady. This is what RANS solves for.', space: `<msub>${bar('u')}<mi>i</mi></msub><mo>(</mo><mi>𝐱</mi><mo>)</mo><mo>∈</mo><mi>ℝ</mi><mo>,</mo><mspace width=".5em"/>${bar('u')}<mo>:</mo><msup><mi>ℝ</mi><mn>3</mn></msup><mo>→</mo><msup><mi>ℝ</mi><mn>3</mn></msup>`, col: '--c-rho', op: 'A' },
  up: { sym: '<msubsup><mi>u</mi><mi>i</mi><mo>′</mo></msubsup>', name: 'Fluctuation', def: 'u′ᵢ = uᵢ − ūᵢ: the part averaging throws away. It averages to zero, but its products do not.', space: '<msubsup><mi>u</mi><mi>i</mi><mo>′</mo></msubsup><mo>(</mo><mi>𝐱</mi><mo>,</mo><mi>t</mi><mo>)</mo><mo>∈</mo><mi>ℝ</mi><mo>,</mo><mspace width=".5em"/><mo>⟨</mo><msubsup><mi>u</mi><mi>i</mi><mo>′</mo></msubsup><mo>⟩</mo><mo>=</mo><mn>0</mn>', col: '--c-u', op: 'A' },
  Rs: { sym: '<mo>⟨</mo><msubsup><mi>u</mi><mi>i</mi><mo>′</mo></msubsup><msubsup><mi>u</mi><mi>j</mi><mo>′</mo></msubsup><mo>⟩</mo>', name: 'Reynolds stress', def: 'Averages of products of fluctuations: 6 numbers per point. −ρ⟨u′ᵢu′ⱼ⟩ acts on the mean flow like an extra stress, and nobody knows it: the closure problem.', space: `<mo>⟨</mo><msubsup><mi>u</mi><mi>i</mi><mo>′</mo></msubsup><msubsup><mi>u</mi><mi>j</mi><mo>′</mo></msubsup><mo>⟩</mo><mo>∈</mo>${Rsym}<mspace width=".5em"/><mtext>per point</mtext>`, col: '--c-nu', op: 'B' },
  A: { sym: '<mi>A</mi>', name: 'Averaging operator', def: 'Takes a field over space and time and returns its time average, a field over space only. Like a daily mean temperature: the weather’s ups and downs vanish. Linear, and it commutes with derivatives.', space: '<mi>A</mi><mo>:</mo><mo>(</mo><msup><mi>ℝ</mi><mn>3</mn></msup><mo>×</mo><mi>ℝ</mi><mo>→</mo><mi>ℝ</mi><mo>)</mo><mo>→</mo><mo>(</mo><msup><mi>ℝ</mi><mn>3</mn></msup><mo>→</mo><mi>ℝ</mi><mo>)</mo><mo>,</mo><mspace width=".5em"/><mtext>linear</mtext>', col: '--c-rho', op: 'A' },
  p: { sym: bar('p'), name: 'Mean pressure', def: 'The time-averaged pressure. Its gradient pushes the mean flow; in the channel −∂ₓp̄ is the fixed driving force.', space: `${bar('p')}<mo>(</mo><mi>𝐱</mi><mo>)</mo><mo>∈</mo><mi>ℝ</mi>`, col: '--c-w' },
  rho: { sym: '<mi>ρ</mi>', name: 'Density', def: 'Constant here (incompressible flow).', space: '<mi>ρ</mi><mo>∈</mo><msub><mi>ℝ</mi><mrow><mo>&gt;</mo><mn>0</mn></mrow></msub><mspace width=".5em"/><mtext>(constant)</mtext>', col: '--c-w' },
  nu: { sym: '<mi>ν</mi>', name: 'Kinematic viscosity', def: 'A property of the fluid (air ≈ 1.5 × 10⁻⁵ m²/s). It sets the thin viscous layer next to the wall.', space: '<mi>ν</mi><mo>∈</mo><msub><mi>ℝ</mi><mrow><mo>&gt;</mo><mn>0</mn></mrow></msub>', col: '--c-w' },
  grad: { sym: '<msub><mo>∂</mo><mi>j</mi></msub>', name: 'Partial derivative', def: 'Rate of change along axis j.', space: '<msub><mo>∂</mo><mi>j</mi></msub><mo>:</mo><mtext>field → field, linear</mtext>', col: '--ink' },
  S: { sym: `<msub>${bar('S')}<mrow><mi>i</mi><mi>j</mi></mrow></msub>`, name: 'Mean strain rate', def: 'How fast the mean flow stretches and shears a fluid element: the symmetric half of ∂ⱼūᵢ. Its size is S̄ = √(2S̄ᵢⱼS̄ᵢⱼ).', space: `<msub>${bar('S')}<mrow><mi>i</mi><mi>j</mi></mrow></msub><mo>∈</mo>${Rsym}<mo>,</mo><mspace width=".5em"/><msub>${bar('S')}<mrow><mi>i</mi><mi>i</mi></mrow></msub><mo>=</mo><mn>0</mn>`, col: '--c-eq', op: 'B' },
  nut: { sym: '<msub><mi>ν</mi><mi>t</mi></msub>', name: 'Eddy viscosity', def: 'How strongly the eddies mix momentum, written as an extra viscosity. A property of the flow, not the fluid: often 100–1000 × ν away from walls.', space: '<msub><mi>ν</mi><mi>t</mi></msub><mo>(</mo><mi>𝐱</mi><mo>)</mo><mo>∈</mo><msub><mi>ℝ</mi><mrow><mo>≥</mo><mn>0</mn></mrow></msub>', col: '--c-c', op: 'B' },
  k: { sym: '<mi>k</mi>', name: 'Turbulent kinetic energy', def: 'k = ½⟨u′ᵢu′ᵢ⟩: the energy per unit mass hidden in the fluctuations. Carried by its own transport equation.', space: '<mi>k</mi><mo>(</mo><mi>𝐱</mi><mo>)</mo><mo>∈</mo><msub><mi>ℝ</mi><mrow><mo>≥</mo><mn>0</mn></mrow></msub>', col: '--c-cs', op: 'M' },
  om: { sym: '<mi>ω</mi>', name: 'Specific dissipation rate', def: 'ω = ε/(β*k): how fast eddies lose their energy, in 1/time. √k/ω is the size of the energetic eddies.', space: '<mi>ω</mi><mo>(</mo><mi>𝐱</mi><mo>)</mo><mo>∈</mo><msub><mi>ℝ</mi><mrow><mo>&gt;</mo><mn>0</mn></mrow></msub>', col: '--c-tau', op: 'M' },
  dl: { sym: '<msub><mi>δ</mi><mrow><mi>i</mi><mi>j</mi></mrow></msub>', name: 'Kronecker delta', def: '1 if i = j, else 0: the 3 × 3 identity in index notation. δᵢᵢ = 3.', space: `<msub><mi>δ</mi><mrow><mi>i</mi><mi>j</mi></mrow></msub><mo>∈</mo>${Rm(3,3)}`, col: '--c-w' },
  B: { sym: '<mi>B</mi>', name: 'Boussinesq closure map', def: 'Turns the mean strain, with k and ν_t, into the six Reynolds stresses: eddies treated like extra-sticky molecules. Linear in S̄, applied cell by cell.', space: `<mi>B</mi><mo>:</mo>${Rsym}<mo>×</mo><mi>ℝ</mi><mo>×</mo><mi>ℝ</mi><mo>→</mo>${Rsym}`, col: '--c-c', op: 'B' },
  a1: { sym: '<msub><mi>a</mi><mn>1</mn></msub>', name: 'Bradshaw constant', def: 'a₁ = 0.31. Caps the shear stress at a₁k, from Bradshaw’s observation that −⟨u′v′⟩ ≈ 0.3k in boundary layers. The heart of SST.', space: '<msub><mi>a</mi><mn>1</mn></msub><mo>=</mo><mn>0.31</mn>', col: '--c-c', op: 'B' },
  F1: { sym: '<msub><mi>F</mi><mn>1</mn></msub><mo>,</mo><msub><mi>F</mi><mn>2</mn></msub>', name: 'Blending functions', def: 'F₁ is 1 near walls (k-ω constants) and 0 far away (k-ε constants). F₂ turns the ν_t limiter on inside boundary layers. Both depend on wall distance, k and ω.', space: '<msub><mi>F</mi><mn>1</mn></msub><mo>,</mo><msub><mi>F</mi><mn>2</mn></msub><mo>:</mo><mo>(</mo><mi>d</mi><mo>,</mo><mi>k</mi><mo>,</mo><mi>ω</mi><mo>)</mo><mo>→</mo><mo>[</mo><mn>0</mn><mo>,</mo><mn>1</mn><mo>]</mo>', col: '--c-w', op: 'M' },
  M: { sym: '<mi>M</mi>', name: 'Model source map', def: 'Per cell: from k, ω and the mean strain, how much k and ω are made and destroyed. Like a bank balance: income (production) against spending (destruction). Nonlinear.', space: '<mi>M</mi><mo>:</mo><mo>(</mo><mi>k</mi><mo>,</mo><mi>ω</mi><mo>,</mo><mover accent="true"><mi>S</mi><mo>¯</mo></mover><mo>)</mo><mo>∈</mo><msup><mi>ℝ</mi><mn>3</mn></msup><mo>→</mo><msup><mi>ℝ</mi><mn>2</mn></msup>', col: '--c-cs', op: 'M' },
  Pk: { sym: '<msub><mover accent="true"><mi>P</mi><mo>~</mo></mover><mi>k</mi></msub>', name: 'Production', def: 'Energy the mean shear feeds into the eddies, ν_tS̄². SST caps it at 10β*kω so it cannot run away where flow hits a body.', space: '<msub><mover accent="true"><mi>P</mi><mo>~</mo></mover><mi>k</mi></msub><mo>∈</mo><msub><mi>ℝ</mi><mrow><mo>≥</mo><mn>0</mn></mrow></msub>', col: '--c-c', op: 'M' },
  Dk: { sym: '<msup><mi>β</mi><mo>*</mo></msup><mi>k</mi><mi>ω</mi>', name: 'Destruction', def: 'Energy the smallest eddies turn into heat (the dissipation ε = β*kω); in the ω equation βω² plays the same role.', space: '<msup><mi>β</mi><mo>*</mo></msup><mi>k</mi><mi>ω</mi><mo>∈</mo><msub><mi>ℝ</mi><mrow><mo>≥</mo><mn>0</mn></mrow></msub>', col: '--c-nu', op: 'M' },
  Dif: { sym: '<msub><mo>∂</mo><mi>j</mi></msub><mo>[</mo><mo>(</mo><mi>ν</mi><mo>+</mo><mi>σ</mi><msub><mi>ν</mi><mi>t</mi></msub><mo>)</mo><msub><mo>∂</mo><mi>j</mi></msub><mo>·</mo><mo>]</mo>', name: 'Diffusion', def: 'Spreads k and ω from where they are made to where they are not: molecular ν plus eddy mixing σν_t. It is what carries k down to the wall.', space: '<mtext>field → field, linear in </mtext><mi>k</mi><mtext> (or </mtext><mi>ω</mi><mtext>)</mtext>', col: '--c-f' },
  bs: { sym: '<msup><mi>β</mi><mo>*</mo></msup>', name: 'β*', def: 'β* = 0.09: sets ε = β*kω. Its square root (0.3) is the log-layer ratio −⟨u′v′⟩/k.', space: '<msup><mi>β</mi><mo>*</mo></msup><mo>=</mo><mn>0.09</mn>', col: '--c-nu', op: 'M' },
  beta: { sym: '<mi>β</mi>', name: 'β', def: 'Destruction coefficient of ω: β₁ = 0.075 near walls, β₂ = 0.0828 outside, blended with F₁.', space: '<mi>β</mi><mo>=</mo><msub><mi>F</mi><mn>1</mn></msub><mo>·</mo><mn>0.075</mn><mo>+</mo><mo>(</mo><mn>1</mn><mo>−</mo><msub><mi>F</mi><mn>1</mn></msub><mo>)</mo><mo>·</mo><mn>0.0828</mn>', col: '--c-nu', op: 'M' },
  gam: { sym: '<mi>γ</mi>', name: 'γ', def: 'Production coefficient of ω: γ₁ = 5/9 near walls, γ₂ = 0.44 outside. Tied to the others by the log law.', space: '<mi>γ</mi><mo>=</mo><msub><mi>F</mi><mn>1</mn></msub><mo>·</mo><mfrac><mn>5</mn><mn>9</mn></mfrac><mo>+</mo><mo>(</mo><mn>1</mn><mo>−</mo><msub><mi>F</mi><mn>1</mn></msub><mo>)</mo><mo>·</mo><mn>0.44</mn>', col: '--c-c', op: 'M' },
  sig: { sym: '<msub><mi>σ</mi><mi>k</mi></msub><mo>,</mo><msub><mi>σ</mi><mi>ω</mi></msub>', name: 'Diffusion coefficients', def: 'How strongly eddies spread k and ω: σ_k = 0.85 → 1.0 and σ_ω = 0.5 → 0.856 from wall to free stream (SST).', space: '<msub><mi>σ</mi><mi>k</mi></msub><mo>,</mo><msub><mi>σ</mi><mi>ω</mi></msub><mo>∈</mo><msub><mi>ℝ</mi><mrow><mo>&gt;</mo><mn>0</mn></mrow></msub>', col: '--c-f' },
  cd: { sym: '<mi>C</mi><msub><mi>D</mi><mrow><mi>k</mi><mi>ω</mi></mrow></msub>', name: 'Cross diffusion', def: 'The extra term that turns k-ω into k-ε away from walls, where (1 − F₁) → 1. It removes k-ω’s sensitivity to the free-stream ω.', space: '<mi>C</mi><msub><mi>D</mi><mrow><mi>k</mi><mi>ω</mi></mrow></msub><mo>∈</mo><mi>ℝ</mi>', col: '--c-w', op: 'M' },
  I: { sym: '<mi>I</mi>', name: 'Steady iteration map', def: 'One update of everything: measure the residual, solve the linearised system for a correction, add it. Repeat until R ≈ 0. Like tuning a guitar: pluck, adjust, pluck again.', space: `<mi>I</mi><mo>:</mo>${R6N}<mo>→</mo>${R6N}<mo>,</mo><mspace width=".5em"/><mi>N</mi><mo>=</mo><msub><mi>N</mi><mi>x</mi></msub><msub><mi>N</mi><mi>y</mi></msub><msub><mi>N</mi><mi>z</mi></msub>`, col: '--c-u', op: 'I' },
  R: { sym: '<mi>R</mi>', name: 'Residual', def: 'How badly the current state breaks the steady equations, cell by cell. Zero means solved.', space: `<mi>R</mi><mo>:</mo>${R6N}<mo>→</mo>${R6N}<mo>,</mo><mspace width=".5em"/><mtext>nonlinear</mtext>`, col: '--c-nu', op: 'I' },
  J: { sym: '<mi>J</mi>', name: 'Jacobian', def: 'J = ∂R/∂q: how each residual reacts to each unknown. Sparse: a cell couples only to its face neighbours.', space: '<mi>J</mi><mo>∈</mo><msup><mi>ℝ</mi><mrow><mn>6</mn><mi>N</mi><mo>×</mo><mn>6</mn><mi>N</mi></mrow></msup><mo>,</mo><mspace width=".5em"/><mtext>sparse</mtext>', col: '--c-tau', op: 'I' },
  dq: { sym: '<mi>Δ</mi><mi>q</mi>', name: 'Correction', def: 'What one iteration adds to the state.', space: `<mi>Δ</mi><mi>q</mi><mo>∈</mo>${R6N}`, col: '--c-f', op: 'I' },
  dtau: { sym: '<mi>Δ</mi><mi>τ</mi>', name: 'Pseudo-time step', def: 'A fake time step that damps each correction. Small: safe but slow. Δτ → ∞: Newton’s method. Usually set per cell through a CFL number.', space: '<mi>Δ</mi><mi>τ</mi><mo>∈</mo><msub><mi>ℝ</mi><mrow><mo>&gt;</mo><mn>0</mn></mrow></msub>', col: '--c-w', op: 'I' }
 },
 bench(){
  const now = () => (typeof performance !== 'undefined' ? performance.now() : Date.now()), out = [];
  for (const re of [550, 5200]) {
   { const w = Channel(re, 'sst'); for (let i=0;i<30;i++) w.step(BUILD_CFL); }   // warm-up (JIT)
   const ch = Channel(re, 'sst'); let n = 0; const t0 = now(); while (n < 3000 && ch.step(BUILD_CFL) > 1e-9) n++; const t1 = now(); const m = ch.metrics();
   out.push(`Re_τ=${re}: ${n} iterations, ${((t1-t0)/n).toFixed(3)} ms/iteration (${(t1-t0).toFixed(0)} ms total, ${BUILD_PER_FRAME} per frame), C_f ${(100*(m.Cf/m.Cfd-1)).toFixed(1)}% vs Dean, max |u⁺ − log law| ${m.dev.toFixed(2)} for 30 ≤ y⁺ ≤ 0.2Re_τ`);
  }
  return out.join(' | ');
 },
 mount(root, K){ return mountRans.call(this, root, K); }
});

const BUILD_PER_FRAME = 1;
const REs = [180, 395, 550, 1000, 2000, 5200];

// ---------- everything that draws ----------
function mountRans(root, K){
const {$, reduce, MONO, MATH, P, hidpi, arrow, rr, pill, label, ease, lerp, clamp, proj, orbit, isAct} = K;
const triad = K.triad;
const F10 = '10px "IBM Plex Mono", monospace', F11 = '11px "IBM Plex Mono", monospace', B11 = '600 11px "IBM Plex Mono", monospace', B12 = '600 12px "IBM Plex Mono", monospace', SANS = '600 12px "IBM Plex Sans", sans-serif';
const vis = cv => cv.offsetParent !== null;
const fx = (v, d=2) => (v < 0 ? '−' : '') + Math.abs(v).toFixed(d);
const SUP = {'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};

    for (let j=0;j<NYH;j++) fluct[j] = 0.8*fluct[j] + 0.6*gauss(fnoise);

 dest: {sym: '<msub><mi>c</mi><mrow><mi>w</mi><mn>1</mn></mrow></msub><msub><mi>f</mi><mi>w</mi></msub><msup><mrow><mo>(</mo><mover accent="true"><mi>ν</mi><mo>~</mo></mover><mo>/</mo><mi>l</mi><mo>)</mo></mrow><mn>2</mn></msup>', name: 'Destruction', def: 'Walls (and in DES, the grid) kill eddy viscosity. Grows like 1/l²: a shorter l destroys much more.', space: `<mi>D</mi><mo>∈</mo>${Rnn}<mo>,</mo><mspace width=".4em"/><mtext>per cell, nonlinear</mtext>`, col: '--c-eq', op: 'T'},

 cw1: {sym: '<msub><mi>c</mi><mrow><mi>w</mi><mn>1</mn></mrow></msub>', name: 'Destruction constant', def: 'c_b1/κ² + (1 + c_b2)/σ ≈ 3.239: chosen so ν̃ = κu_τd balances exactly in the log layer.', space: '<msub><mi>c</mi><mrow><mi>w</mi><mn>1</mn></mrow></msub><mo>≈</mo><mn>3.239</mn>', col: '--c-eq'},
 fw: {sym: '<msub><mi>f</mi><mi>w</mi></msub>', name: 'Destruction shape', def: 'A function of r = ν̃/(S̃κ²l²); equals 1 at r = 1 (log layer) and levels off for large r.', space: '<msub><mi>f</mi><mi>w</mi></msub><mo>:</mo><mo>[</mo><mn>0</mn><mo>,</mo><mn>10</mn><mo>]</mo><mo>→</mo><msub><mi>ℝ</mi><mrow><mo>≥</mo><mn>0</mn></mrow></msub>', col: '--c-eq'},
 fv1: {sym: '<msub><mi>f</mi><mrow><mi>v</mi><mn>1</mn></mrow></msub>', name: 'Near-wall damping', def: 'χ³/(χ³ + 7.1³) with χ = ν̃/ν. Close to 1 away from the wall, small in the viscous sublayer.', space: '<msub><mi>f</mi><mrow><mi>v</mi><mn>1</mn></mrow></msub><mo>∈</mo><mo>[</mo><mn>0</mn><mo>,</mo><mn>1</mn><mo>)</mo>', col: '--c-nu'},
 sig: {sym: '<mi>σ</mi>', name: 'Diffusion constant', def: '2/3: ν̃ diffuses with coefficient (ν + ν̃)/σ.', space: '<mi>σ</mi><mo>=</mo><mfrac><mn>2</mn><mn>3</mn></mfrac>', col: '--c-w'},
 cb2: {sym: '<msub><mi>c</mi><mrow><mi>b</mi><mn>2</mn></mrow></msub>', name: 'Gradient constant', def: '0.622: weights the (∂ν̃)² term in the diffusion.', space: '<msub><mi>c</mi><mrow><mi>b</mi><mn>2</mn></mrow></msub><mo>=</mo><mn>0.622</mn>', col: '--c-w'},
 Dt: {sym: '<mfrac><mi>D</mi><mrow><mi>D</mi><mi>t</mi></mrow></mfrac>', name: 'Material derivative', def: '∂_t + u_j∂_j: the change seen while riding along with the fluid.', space: '<mfrac><mi>D</mi><mrow><mi>D</mi><mi>t</mi></mrow></mfrac><mo>=</mo><msub><mo>∂</mo><mi>t</mi></msub><mo>+</mo><msub><mi>u</mi><mi>j</mi></msub><msub><mo>∂</mo><mi>j</mi></msub><mspace width=".4em"/><mtext>(field → field)</mtext>', col: '--ink'},

terms.utau = {sym: '<msub><mi>u</mi><mi>τ</mi></msub>', name: 'Friction velocity', def: '√(wall shear stress / density): the velocity scale of the wall layer. Log layer: ∂U/∂y = u_τ/(κd).', space: `<msub><mi>u</mi><mi>τ</mi></msub><mo>∈</mo>${Rpos}`, col: '--c-u'};

const DIFF = tg('diff', fr(mn(1), SIG)+mo('[')+dJ+pa(pa(NU_+mo('+')+NT)+dJ+NT)+mo('+')+CB2+dJ+NT+dJ+NT+mo(']'));

  dstep('d', `${D_}${pa(mi('𝐱'))}<mo>=</mo>${sb(mi('min'), mr(sb(mi('𝐱'), mi('w'))+mo('∈')+mt('wall')))}<mo>|</mo><mi>𝐱</mi><mo>−</mo>${sb(mi('𝐱'), mi('w'))}<mo>|</mo><mspace width="1em"/><mo>⇔</mo><mspace width="1em"/>${sq(sb(mo('∂'), jI)+D_+sb(mo('∂'), jI)+D_)}<mo>=</mo><mn>1</mn><mo>,</mo><mspace width=".5em"/>${D_}<mo>=</mo><mn>0</mn><mtext> on walls</mtext>`,
    'The wall distance is pure geometry. Codes find it with a search tree over wall faces or by solving the Eikonal equation on the right; on a fixed mesh it is done once, on a moving mesh every step.'))}` },

{ key: 'A', title: 'One model, two roles', note: 'DES97: the length decides RANS or LES', html: `<div class="eqhero">
  <math display="block">${DNDT}<mo>=</mo>${ub(PROD, 'prod', 'T: production')}<mo>−</mo>${ub(DEST, 'dest', 'T: destruction')}<mo>+</mo>${ub(DIFF, 'diff', 'T: diffusion')}</math>

</div>

    <div class="ctl"><label for="ddes-adel" class="sym" style="color:var(--c-cs)">Δ∥/δ</label><input type="range" id="ddes-adel" min="0.1" max="2" step="0.05" value="0.3"><output id="ddes-adelv">0.30</output></div>

    'RANS role. Put ν̃ = κu<sub>τ</sub>d and S̃ = u<sub>τ</sub>/(κd) (the log layer) into the equation: production, destruction and diffusion are each a constant times u<sub>τ</sub>². They cancel only if c<sub>w1</sub> ≈ 3.239. That is how the wall distance d got into the model.') +
  dstep('2', `${CB1}${SV}${NT}<mo>=</mo>${CW1}${FW}${sp(pa(fr(NT, mr(CDES+DEL))), mn(2))}<mspace width="1em"/><mo>⇒</mo><mspace width="1em"/>${NUT}<mo>≈</mo><mn>0.042</mn><mspace width=".2em"/>${SV}${sp(DEL, mn(2))}<mo>=</mo>${sp(pa(mn('0.20')+DEL), mn(2))}${SV}`,
    'LES role. Far from walls, put l = C<sub>DES</sub>Δ and let production balance destruction (local equilibrium). Solving it with the SA constants gives the Smagorinsky subgrid model with C<sub>s</sub> ≈ 0.20 (computed here; f<sub>w</sub> ≈ 0.42 at the balance). Same equation, new role.') +
  dstep('3', `${D_}<mo>&gt;</mo>${CDES}${DEL}<mspace width="1em"/><mo>⇒</mo><mspace width="1em"/>${fr(tg('dest', mi('D')), tg('dest', sb(mi('D'), mt('RANS'))))}<mo>=</mo>${sp(pa(fr(D_, mr(CDES+DEL))), mn(2))}<mo>&gt;</mo><mn>1</mn>`,
    'The trap: refine Δx and Δz inside an attached boundary layer (δ/3, say) and the switch moves inside it. Destruction jumps by (d/l)², ν̃ and the modelled stress fall, but the grid is still far too coarse to carry the eddies that should replace them. This is <b>modelled-stress depletion</b>: skin friction drops, and under an adverse pressure gradient the flow can separate early (grid-induced separation).'))}` },

  <div class="dstep"><span class="k">G</span><div class="dm">${MB(UBi + o('(') + R('xx', m('𝐱')) + o(',') + tt + o(')') + o('=') + o('∫') + OPG + o('(') + R('xx', m('𝐱')) + o('−') + R('xx', sp(m('𝐱'), o('′'))) + o(')') + SPC('.2em') + Ui + o('(') + R('xx', sp(m('𝐱'), o('′'))) + o(',') + tt + o(')') + SPC('.2em') + m('d') + sp(R('xx', sp(m('𝐱'), o('′'))), n(3)))}</div><p>The filter as a convolution: a weighted average of u over a blob of width Δ around 𝐱. In most codes nobody applies G explicitly: the grid and the numerics act as the filter, and Δ is the cell size ("implicit filtering").</p></div>
  <div class="dstep"><span class="k">M</span><div class="dm">${MB(NUT + o('=') + sp(row(o('('), CS, DEL, o(')')), n(2)) + SMAG + SPC('1em') + o('⇒') + SPC('1em') + TAU + o('−') + fr(n(1), n(3)) + R('tau', sb(m('τ'), row(kk, kk))) + DIJ + o('=') + o('−') + n(2) + NUT + SIJ)}</div><p>M is local: each cell needs only the velocity differences to its neighbours. It is nonlinear: |S̄| grows with the strain, so ν_sgs does too.</p></div>

</details>`;

  <div class="dstep"><span class="k">1</span><div class="dm">${MB(R('tau', m('Π')) + o('=') + n(2) + NUT + SIJ + SIJ + o('=') + NUT + sp(SMAG, n(2)) + SPC('.6em') + o('≈') + SPC('.6em') + m('ε') + SPC('1em') + o('⇒') + SPC('1em') + CS + o('≈') + n('0.17'))}</div><p>Where C<sub>s</sub> comes from (Lilly 1967): if the energy drained at the grid scale equals the dissipation ε of a Kolmogorov −5/3 spectrum, the constant comes out near 0.17. In channels about 0.1 is used, because mean shear inflates |S̄|.</p></div>
  <div class="dstep"><span class="k">2</span><div class="dm">${MB(NUT + o('→') + sp(row(o('('), CS, DEL, o(')')), n(2)) + o('|') + fr(m('d') + m('U'), m('d') + m('y')) + o('|') + o('≠') + n(0) + SPC('1.5em') + tx('but the truth is ') + NUT + o('∝') + sp(m('y'), n(3)))}</div><p>The wall problem: the mean shear at a wall is large, so Smagorinsky stays switched on where the true turbulent stress vanishes like y³. The old fix multiplies by van Driest's damping (1 − e<sup>−y⁺/26</sup>)², which needs the wall distance.</p></div>
  <div class="dstep"><span class="k">3</span><div class="dm">${MB(NUT + o('=') + R('Vr', m('c')) + sq(fr(R('Vr', sb(m('B'), m('β'))), row(sb(m('α'), ij), sb(m('α'), ij)))) + o(',') + SPC('.5em') + R('Vr', sb(m('β'), ij)) + o('=') + sp(sb(m('Δ'), m('m')), n(2)) + sb(m('α'), row(m('m'), ii)) + sb(m('α'), row(m('m'), jj)) + o(',') + SPC('.5em') + R('Vr', m('c')) + o('≈') + n('2.5') + sp(CS, n(2)))}</div><p>Vreman (2004) uses only the local gradient α<sub>ij</sub> = ∂ū<sub>j</sub>/∂x<sub>i</sub>, yet B<sub>β</sub> is exactly 0 in pure shear and in many other simple laminar flows, so it switches itself off in near-wall shear and in laminar regions. WALE (Nicoud &amp; Ducros 1999) builds ν<sub>sgs</sub> from the traceless square of the gradient and gets the y³ wall behaviour right.</p></div>

</details>`;

  <div class="stack">
    <p><strong>Local work</strong>: the fluxes, the explicit step and ν<sub>sgs</sub> use one layer of neighbours. Split the grid into blocks, one per GPU or core, and swap a one-cell halo with the neighbours each stage.</p>
    <p><strong>The wall model is local too</strong>: one Newton solve per wall face, independent of every other face. It is a thin 2D layer of work: <span id="wmles-wmshare">a small share</span> of a step in your Build solver.</p>
    <p><strong>The pressure Poisson equation is global</strong>: ∇²φ = ∇·u* couples every cell to every other. With periodic x and z, FFTs turn it into one small tridiagonal solve per Fourier mode, but each FFT needs a whole line of data on one processor: the grid must be <strong>transposed</strong> (all-to-all messages) between directions. Without periodicity, multigrid does the job with neighbour exchanges on ever coarser grids.</p>

const PARALLEL = `<div class="par">
  <div class="stack">
    <p><strong>Local work:</strong> the SGS model, the products ūᵢūⱼ and the Runge–Kutta update touch one grid point at a time. In a finite-difference code the filter and the test filter are small stencils (e.g. ¼, ½, ¼): only a one-cell halo is exchanged.</p>
    <p><strong>Global work:</strong> a spectral code computes every derivative, filter and projection with 3D FFTs. A 1D FFT needs a whole line of the box, so each 3D FFT reshuffles the field among ranks (an all-to-all transpose). This step dominates at scale.</p>
    <p><strong>One small global sum:</strong> the dynamic procedure averages ⟨LM⟩ and ⟨MM⟩ over the box (or over wall-parallel planes): two numbers per step, one allreduce.</p>
  </div>
  <canvas id="wrles-decomp" data-w="340" data-h="250" style="width:100%;max-width:340px;border-radius:8px;background:var(--bg)" aria-label="The box split into slabs or pencils, one per rank, with the transpose that the FFT needs"></canvas>
</div>
<h3 style="font-size:16px">Slabs or pencils?</h3>
<p>A wall-resolved LES of an airliner wing (Re ≈ 10⁸) needs 10¹⁰–10¹¹ points. Treat it as a periodic box of N = 4096 points per side (6.9 × 10¹⁰ points, about 200 bytes each) and get it onto <strong>at least 65 536 ranks</strong> with at most 4 GB per rank. Pick a decomposition, then set N and the ranks.</p>
<div class="btns"><button class="b" id="wrles-slab">Slabs (1D split)</button><button class="b" id="wrles-pencil">Pencils (2D split)</button></div>
<div class="ctl"><label for="wrles-np">ranks</label><input type="range" id="wrles-np" min="6" max="20" step="1" value="10"><output id="wrles-npv">1024</output></div>
<div class="ctl"><label for="wrles-nn">N</label><input type="range" id="wrles-nn" min="9" max="13" step="1" value="12"><output id="wrles-nnv">4096</output></div>
<div class="fb" id="wrles-decfb"></div>
<details><summary>Further optimizations</summary><p>Overlap the transposes with computation (one velocity component in flight while the next is transformed). Use real-to-complex FFTs to halve the data. Pack two real fields into one complex transform, as the Build solver does. On GPUs, cuFFT plus NVLink/InfiniBand all-to-alls; finite-difference LES codes on unstructured wall grids replace the FFT with a pressure Poisson solve (multigrid), whose coarse levels are the global bottleneck instead.</p></details>`;

const SOURCES = [

 ['Germano, Piomelli, Moin & Cabot, A dynamic subgrid-scale eddy viscosity model, Phys. Fluids A 3, 1760 (1991)', 'https://doi.org/10.1063/1.857955'],

 ['Choi, H. & Moin, P., Grid-point requirements for large eddy simulation: Chapman\'s estimates revisited, Phys. Fluids 24, 011702 (2012)', 'https://doi.org/10.1063/1.3676783'],
 ['Yang, X. I. A. & Griffin, K. P., Grid-point and time-step requirements for DNS and LES, Phys. Fluids 33, 015108 (2021)', 'https://arxiv.org/abs/2010.15307'],

// term definitions are shown as plain text: turn <sub>/<sup> into Unicode scripts
const SUBM = {0:'₀',1:'₁',2:'₂',3:'₃',4:'₄',5:'₅',6:'₆',7:'₇',8:'₈',9:'₉',a:'ₐ',e:'ₑ',h:'ₕ',i:'ᵢ',j:'ⱼ',k:'ₖ',l:'ₗ',m:'ₘ',n:'ₙ',o:'ₒ',p:'ₚ',r:'ᵣ',s:'ₛ',t:'ₜ',u:'ᵤ',v:'ᵥ',x:'ₓ','τ':'ᵧ'.replace('ᵧ','τ')};
const SUPM = {0:'⁰',1:'¹',2:'²',3:'³',4:'⁴',5:'⁵',6:'⁶',7:'⁷',8:'⁸',9:'⁹','/':'ᐟ','-':'⁻','−':'⁻'};
const plain = s => s.replace(/<sub>(.*?)<\/sub>/g, (_, x) => [...x].every(c => SUBM[c] && c !== 'τ') ? [...x].map(c => SUBM[c]).join('') : '_' + x)
  .replace(/<sup>(.*?)<\/sup>/g, (_, x) => [...x].every(c => SUPM[c]) ? [...x].map(c => SUPM[c]).join('') : '^' + x);
Object.values(TERMS).forEach(t => { t.def = plain(t.def); });

// ---- small FFT for 1D lines and 2D pictures ----
function mkFFT1(n){ const lg = Math.log2(n)|0, rev = new Int32Array(n), cr = new Float64Array(n/2), ci = new Float64Array(n/2);
  for (let i=0;i<n;i++){ let r = 0; for (let b=0;b<lg;b++) r |= ((i>>b)&1) << (lg-1-b); rev[i] = r; }
  for (let i=0;i<n/2;i++){ cr[i] = Math.cos(2*Math.PI*i/n); ci[i] = -Math.sin(2*Math.PI*i/n); }
  return (re, im, inv) => { for (let i=0;i<n;i++){ const j = rev[i]; if (j > i){ let t = re[i]; re[i] = re[j]; re[j] = t; t = im[i]; im[i] = im[j]; im[j] = t; } }
    const sg = inv ? -1 : 1;
    for (let s=2;s<=n;s<<=1){ const h = s>>1, st = n/s; for (let a=0;a<n;a+=s) for (let k=0;k<h;k++){ const wr = cr[k*st], wi = sg*ci[k*st], i = a+k, j = i+h, xr = re[j]*wr-im[j]*wi, xi = re[j]*wi+im[j]*wr; re[j] = re[i]-xr; im[j] = im[i]-xi; re[i] += xr; im[i] += xi; } } }; }
function mkFFT2(n){ const f = mkFFT1(n), tr = new Float64Array(n), ti = new Float64Array(n);
  return (re, im, inv) => { for (let y=0;y<n;y++) f(re.subarray(y*n, y*n+n), im.subarray(y*n, y*n+n), inv);
    for (let x=0;x<n;x++){ for (let y=0;y<n;y++){ tr[y] = re[y*n+x]; ti[y] = im[y*n+x]; } f(tr, ti, inv); for (let y=0;y<n;y++){ re[y*n+x] = tr[y]; im[y*n+x] = ti[y]; } } }; }

// ---- the walkthrough's line: 64 samples of u_x along x, with a steep front (so energy really cascades) ----
const N1 = 64, KC1 = 8, KT1 = 4, D1 = Math.PI/KC1, f1 = mkFFT1(N1);
const spec1 = u => { const r = Float64Array.from(u), i = new Float64Array(N1); f1(r, i, false); for (let k=0;k<N1;k++){ r[k] /= N1; i[k] /= N1; } return [r, i]; };
const kk1 = k => k <= N1/2 ? k : k-N1;
const back1 = (r, i) => { const a = Float64Array.from(r), b = Float64Array.from(i); f1(a, b, true); return a; };
const filt1 = (u, kc) => { const [r, i] = spec1(u); for (let k=0;k<N1;k++) if (Math.abs(kk1(k)) > kc){ r[k] = 0; i[k] = 0; } return back1(r, i); };
const ddx1 = u => { const [r, i] = spec1(u), a = new Float64Array(N1), b = new Float64Array(N1); for (let k=0;k<N1;k++){ const q = Math.abs(kk1(k)) === N1/2 ? 0 : kk1(k); a[k] = -q*i[k]; b[k] = q*r[k]; } return back1(a, b); };
const U1 = Float64Array.from({length: N1}, (_, n) => { const x = 2*Math.PI*n/N1; let v = 0; for (let k=1;k<=24;k++) v -= Math.sin(k*x)/k*(1+0.3*Math.cos(3*k)); return 0.6*v; });
const UB1 = filt1(U1, KC1), UH1 = filt1(UB1, KT1), SB1 = ddx1(UB1), SH1 = ddx1(UH1);
const L1 = filt1(UB1.map(v => v*v), KT1).map((v,n) => v-UH1[n]*UH1[n]);
const M1 = filt1(SB1.map(v => Math.abs(v)*v), KT1).map((v,n) => 2*D1*D1*(v-4*Math.abs(SH1[n])*SH1[n]));
const C21 = (() => { let a = 0, b = 0; for (let n=0;n<N1;n++){ a += L1[n]*M1[n]; b += M1[n]*M1[n]; } return a/b; })();
const T1 = SB1.map(s => -2*C21*D1*D1*Math.abs(s)*s);
const AMP1 = (() => { const [r, i] = spec1(U1); return Array.from({length: 25}, (_, k) => 2*(r[k]*r[k]+i[k]*i[k])); })();
// projection example on one Fourier mode
const KP = [1,2,2], UP = [0.6,0.3,-0.4], KU = KP[0]*UP[0]+KP[1]*UP[1]+KP[2]*UP[2], KP2 = 9, PU = UP.map((v,a) => v-KU/KP2*KP[a]);

// ---- block A's model spectrum (Pope 2000, eq. 6.246) in box units: L = 0.71, η = 1/600, ε = 1 ----
const LA = 0.71, ETA = 1/600, NUA = Math.pow(ETA, 4/3);
const EA = k => 1.5*Math.pow(k, -5/3)*Math.pow(k*LA/Math.sqrt((k*LA)**2+6.78), 11/3)*Math.exp(-5.2*(Math.pow((k*ETA)**4+0.4**4, .25)-0.4));
const KG = Array.from({length: 600}, (_, q) => Math.pow(10, -2+q*6/599));
const integ = (g) => { let s = 0; for (let q=1;q<KG.length;q++){ const a = KG[q-1], b = KG[q]; s += .5*(g(a)+g(b))*(b-a); } return s; };
const ETOT = integ(EA), DTOT = integ(k => 2*NUA*k*k*EA(k));
const GF = { sharp: (k, kc) => k <= kc ? 1 : 0, box: (k, kc) => { const x = k*Math.PI/kc/2; return x < 1e-9 ? 1 : Math.sin(x)/x; }, gauss: (k, kc) => Math.exp(-((k*Math.PI/kc)**2)/24), test: (k, kc) => k <= kc/2 ? 1 : 0 };
const kept = (g, kc) => [integ(k => g(k, kc)**2*EA(k))/ETOT, integ(k => g(k, kc)**2*2*NUA*k*k*EA(k))/DTOT];

// symmetric 3 × 3 eigen-decomposition (Jacobi rotations)
function eig3(a){ const A = a.map(r => r.slice()), V = [[1,0,0],[0,1,0],[0,0,1]];
  for (let sw=0;sw<10;sw++) for (const [p,q] of [[0,1],[0,2],[1,2]]){ if (Math.abs(A[p][q]) < 1e-14) continue;
    const th = .5*Math.atan2(2*A[p][q], A[q][q]-A[p][p]), c = Math.cos(th), s = Math.sin(th);
    for (let k=0;k<3;k++){ const x = A[k][p], y = A[k][q]; A[k][p] = c*x-s*y; A[k][q] = s*x+c*y; }
    for (let k=0;k<3;k++){ const x = A[p][k], y = A[q][k]; A[p][k] = c*x-s*y; A[q][k] = s*x+c*y; }
    for (let k=0;k<3;k++){ const x = V[k][p], y = V[k][q]; V[k][p] = c*x-s*y; V[k][q] = s*x+c*y; } }
  return { l: [A[0][0], A[1][1], A[2][2]], v: [0,1,2].map(j => [V[0][j], V[1][j], V[2][j]]) }; }
const SUP = {'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻'};
const sci = v => { if (!isFinite(v) || v === 0) return '0'; const e = Math.floor(Math.log10(Math.abs(v)) + 1e-9), m = v/10**e; return `${m.toFixed(1)}×10${String(e).split('').map(c => SUP[c]).join('')}`; };
const fx = (v, d=3) => (Math.abs(v) < .5*10**-d ? 0 : v).toFixed(d);
// Choi & Moin (2012) prefactor with Yang & Griffin's (2021) assumptions L_z/L_x = 1/4, n_y/(Δx⁺Δz⁺) = 1/200
const NWR = re => 0.021*0.25/200*Math.pow(re, 13/7);
const UTAU = re => Math.sqrt(0.0576*Math.pow(re, -0.2)/2);   // turbulent flat plate, C_f = 0.0576 Re_x^(−1/5)

CFD.register({

 bench(){

    let n = 0; while (n < 2) n += S.advance(0);

    ch.sort((a,b) => a-b); out[name] = { msPerStep: +((now()-t0)/6).toFixed(1), framesPerStepAt9ms: +((now()-t0)/6/9).toFixed(1), chunkMedianMs: +ch[ch.length>>1].toFixed(2), chunkMaxMs: +ch[ch.length-1].toFixed(1) }; }

 mount(root, K){
const { $, reduce, MONO, MATH, P, hex, hidpi, arrow, rr, pill, label, ease, lerp, clamp, proj, box, orbit, isAct } = K;

// ===== 0: the walkthrough on 64 numbers =====

   <figure class="viz"><div class="scrollx"><canvas id="dns-opviz" data-w="880" data-h="350" aria-label="Animated walkthrough on one grid line: the FFT, the spectral derivative, the dealiased product, the projection and the viscous factor"></canvas></div>
     <div class="opctl"><button class="b" id="dns-opplay">Pause</button><div id="dns-opsteps" class="btns"></div></div>
     <p class="opcap" id="dns-opcap"></p></figure>
   <aside class="insp" data-terms="F,D,Nl,P,V,uh,u,k,N"></aside>
   ${DEEP([
     DSTEP('𝓕', `${msub(hat(mi('u')), Ix('i'), 'uh')}<mo>(</mo>${BK}<mo>)</mo><mo>=</mo>${frac(mn(1), msup(NN, mn(3)))}<munder><mo>∑</mo>${BX}</munder>${msub(mi('u'), Ix('i'), 'u')}<mo>(</mo>${BX}<mo>)</mo>${msup(mi('e'), mrow(mo('−')+mi('i')+KJ('j')+msub(mi('x'), Ix('j'))))}`, 'The state and the grid values hold the same information: 𝓕 is an invertible linear map ℂ^(N³) → ℂ^(N³) for each component. The FFT computes it in N³·log₂N³ operations instead of N⁶.'),
     DSTEP('D', `${msub(hat(mrow(mo('(')+DJ('j')+msub(mi('u'), Ix('i'))+mo(')'))), mrow(''))}<mo>=</mo>${DD}${msub(hat(mi('u')), Ix('i'), 'uh')}`, 'Every derivative becomes a multiplication, wave by wave. No stencil, no neighbours: for the waves on the grid it is exact.'),
     DSTEP('V', `${msub(hat(mi('u')), Ix('i'), 'uh')}<mo>(</mo>${TT}<mo>+</mo>${DTT}<mo>)</mo><mo>=</mo>${EXPV}${msub(hat(mi('u')), Ix('i'), 'uh')}<mo>(</mo>${TT}<mo>)</mo><mspace width="1em"/><mtext>if only viscosity acted</mtext>`, 'Viscosity alone damps each wave on its own, at rate νk². The factor V is that exact solution; the solver applies it, so viscosity never limits the time step.')
   ])}` },
 { key: 'A', title: 'Navier–Stokes, nothing modelled', note: 'the equations a DNS solves',
   html: `<div class="eqhero"><math display="block">${mrow(DTd+U('i'), 'dudt')}<mo>+</mo>${ub(mrow(U('j')+DJ('j')+U('i'), 'adv'), 'Nl', 'N: carried by the flow')}<mo>=</mo>${ub(mrow(mo('−')+DJ('i')+PP, 'press'), 'P', 'P: keeps ∂ᵢuᵢ = 0')}<mo>+</mo>${ub(mrow(NU+DJ('j')+DJ('j')+U('i'), 'visc'), 'V', 'V: viscous smoothing')}</math>
     <math display="block" class="sm">${DJ('i')}${U('i')}<mo>=</mo><mn>0</mn><mspace width="2em"/>${msub(mi('u'), mi('x', 'ix'), 'u')}<mo>=</mo><mi>sin</mi><mi>x</mi><mi>cos</mi><mi>y</mi><mi>cos</mi><mi>z</mi><mo>,</mo><mspace width=".6em"/>${msub(mi('u'), mi('y', 'iy'), 'u')}<mo>=</mo><mo>−</mo><mi>cos</mi><mi>x</mi><mi>sin</mi><mi>y</mi><mi>cos</mi><mi>z</mi><mo>,</mo><mspace width=".6em"/>${msub(mi('u'), mi('z', 'iz'), 'u')}<mo>=</mo><mn>0</mn></math></div>

   ${DEEP([
     DSTEP('1', `${DJ('i')}${DJ('i')}${PP}<mo>=</mo><mo>−</mo>${DJ('i')}${DJ('j')}<mo>(</mo>${U('i')}${U('j')}<mo>)</mo>`, 'Take ∂ᵢ of the equation and use ∂ᵢuᵢ = 0: pressure obeys a Poisson equation. It is not a state variable with its own law; it is whatever keeps the flow incompressible, everywhere at once.'),
     DSTEP('2', `${U('j')}${DJ('j')}${U('i')}<mo>=</mo><mo>−</mo>${msub(mi('ϵ'), Ij('i','j','l'), 'lc')}${U('j')}${OM('l')}<mo>+</mo>${DJ('i')}<mo>(</mo>${frac(mn(1), mn(2))}${U('j')}${U('j')}<mo>)</mo>`, 'The rotational form: advection = −(𝐮 × 𝛚) plus a gradient. The gradient merges with the pressure, so the solver only needs u × ω, which conserves energy exactly even on a grid.'),
     DSTEP('3', `${frac(mi('d')+mi('E', 'KE'), mi('d')+TT)}<mo>=</mo><mo>−</mo>${NU}<mo>⟨</mo>${DJ('j')}${U('i')}${DJ('j')}${U('i')}<mo>⟩</mo><mo>=</mo><mo>−</mo>${EPS}`, 'Multiply by uᵢ and average over the periodic box: advection and pressure only move energy around. All loss is viscous, at the rate ε. Nothing is modelled, so this holds term by term.')
   ])}` },
 { key: 'B', title: 'Fourier space', note: 'derivatives, pressure and products',
   html: `<div class="eqhero"><math display="block">${DTd}${msub(hat(mi('u')), Ix('i'), 'uh')}<mo>=</mo>${ub(mrow(PIJ('i','j')+NH('j')), 'P', 'P: only the part ⟂ 𝐤')}<mo>−</mo>${ub(mrow(NU+K2+msub(hat(mi('u')), Ix('i'), 'uh')), 'V', 'V: exact factor e^(−νk²Δt)')}</math>
     <math display="block" class="sm">${PIJ('i','j')}<mo>=</mo>${DEL('i','j')}<mo>−</mo>${frac(KJ('i')+KJ('j'), K2)}<mspace width="1.5em"/>${ub(mrow(NH('j')+mo('=')+FF+mo('[')+msub(mi('ϵ'), Ij('j','l','m'), 'lc')+U('l')+OM('m')+mo(']')), 'Nl', 'N: product on the grid, then cut |kⱼ| > N/3')}<mspace width="1.5em"/>${ub(mrow(DJ('j')+mo('→')+DD), 'D', 'D: derivative = multiply')}</math></div>
   <div class="bb"><figure class="viz">
       <canvas id="dns-kviz" data-w="460" data-h="430" aria-label="One Fourier wave in the 3D box, its wavevector k, and the projection of the nonlinear term onto the plane perpendicular to k; drag to rotate"></canvas>
       <div class="ctl3"><label for="dns-kx" class="sym" style="color:var(--c-c)">k<sub>x</sub></label><input type="range" id="dns-kx" min="-3" max="3" step="1" value="1"><output id="dns-kxv">1</output><label for="dns-ky" class="sym" style="color:var(--c-c)">k<sub>y</sub></label><input type="range" id="dns-ky" min="-3" max="3" step="1" value="2"><output id="dns-kyv">2</output><label for="dns-kz" class="sym" style="color:var(--c-c)">k<sub>z</sub></label><input type="range" id="dns-kz" min="-3" max="3" step="1" value="0"><output id="dns-kzv">0</output><span class="note" style="grid-column:1/-1">drag the picture to rotate · the stripes are the wave cos(k<sub>j</sub>x<sub>j</sub>) on the walls of the box</span></div>
     </figure>
     <aside class="insp" data-terms="P,Nl,D,V,F,uh,k,kj,k2,delta,lc,om,nu,alpha"></aside></div>
   ${DEEP([
     DSTEP('1', `${DJ('j')}${msup(mi('e'), mrow(mi('i')+KJ('l')+msub(mi('x'), Ix('l'))))}<mo>=</mo>${DD}${msup(mi('e'), mrow(mi('i')+KJ('l')+msub(mi('x'), Ix('l'))))}`, 'Why derivatives become multiplications: each Fourier wave is an eigenfunction of ∂ⱼ. Error only comes from waves the grid cannot hold, so accuracy improves faster than any power of N (spectral accuracy).'),
     DSTEP('2', `${hat(PP)}<mo>=</mo><mo>−</mo><mi>i</mi>${frac(KJ('j')+NH('j'), K2)}<mspace width="1em"/><mo>⇒</mo><mspace width="1em"/>${NH('i')}<mo>−</mo><mi>i</mi>${KJ('i')}${hat(PP)}<mo>=</mo>${PIJ('i','j')}${NH('j')}`, 'Pressure in Fourier space: k<sub>j</sub>û<sub>j</sub> = 0 must stay true, so the pressure wave is fixed by k<sub>j</sub>N̂<sub>j</sub>, one division per wave. Subtracting its gradient is the projection P. (With the rotational form this p also contains ½u<sub>j</sub>u<sub>j</sub>.)'),
     DSTEP('3', `${PIJ('i','j')}${PIJ('j','l')}<mo>=</mo>${PIJ('i','l')}<mo>,</mo><mspace width="1em"/>${PIJ('i','j')}${KJ('j')}<mo>=</mo><mn>0</mn><mo>,</mo><mspace width="1em"/>${PIJ('i','j')}${UH('j')}<mo>=</mo>${UH('i')}`, 'P is a projector: applying it twice changes nothing, it kills anything along 𝐤, and it leaves a divergence-free field alone. Viscosity (−νk²ûᵢ) is already ⟂ 𝐤, so it needs no projection.')
   ])}` },
 { key: 'C', title: 'Resolution and cost', note: 'why DNS is the most expensive method',
   html: `<div class="eqhero"><math display="block">${ETA}<mo>=</mo>${msup(mrow(mo('(')+frac(msup(NU, mn(3)), EPS)+mo(')')), frac(mn(1), mn(4)))}<mspace width="1.5em"/>${ub(mrow(KMAX+ETA, 'grp'), 'kmax', 'resolution: ≳ 1 to 1.5')}<mo>,</mo><mspace width="1em"/>${KMAX}<mo>=</mo>${frac(NN, mn(3))}</math>
     <math display="block" class="sm">${ub(mrow(msup(NN, mn(3))+mo('∼')+msup(RE, frac(mn(9), mn(4)))), 'N', 'grid points')}<mspace width="1.2em"/>${ub(mrow(frac(mi('T'), DTT)+mo('∼')+msup(RE, frac(mn(3), mn(4)))), 'dt', 'time steps')}<mspace width="1.2em"/>${ub(mrow(mtx('work')+mo('∼')+msup(RE, mn(3))), 'Re', 'total cost')}</math></div>

       <div class="ctl"><label for="dns-cre" class="sym" style="color:var(--ink)">Re</label><input type="range" id="dns-cre" min="2" max="6" step="0.05" value="3.5"><output id="dns-crev">3 162</output></div>

     <aside class="insp" data-terms="eta,eps,nu,kmax,N,Re,Ek,L,k2,dt"></aside></div>
   ${DEEP([
     DSTEP('1', `${ETA}<mo>=</mo>${msup(mrow(mo('(')+frac(msup(NU, mn(3)), EPS)+mo(')')), frac(mn(1), mn(4)))}<mo>,</mo><mspace width="1em"/>${msub(mi('τ'), mi('η'))}<mo>=</mo>${msup(mrow(mo('(')+frac(NU, EPS)+mo(')')), frac(mn(1), mn(2)))}`, 'Kolmogorov (1941): at the smallest scales only ν and ε matter, and these are the only length and time built from them. There the eddy Reynolds number is 1: viscosity wins.'),
     DSTEP('2', `${EPS}<mo>∼</mo>${frac(msup(mi('U'), mn(3)), mi('L', 'L'))}<mspace width="1em"/><mo>⇒</mo><mspace width="1em"/>${frac(mi('L', 'L'), ETA)}<mo>∼</mo>${msup(RE, frac(mn(3), mn(4)))}<mo>,</mo><mspace width="1em"/>${RE}<mo>=</mo>${frac(mi('U')+mi('L', 'L'), NU)}`, 'Big eddies lose energy in about one turnover, independent of ν. So the range of scales grows as Re³ᐟ⁴ in each direction: N³ ∼ Re⁹ᐟ⁴ points.'),
     DSTEP('3', `${DTT}<mo>∼</mo>${frac(mi('Δ')+mi('x'), mi('U'))}<mo>∼</mo>${frac(ETA, mi('U'))}<mspace width="1em"/><mo>⇒</mo><mspace width="1em"/>${frac(mi('T'), DTT)}<mo>∼</mo>${frac(mi('L', 'L'), ETA)}<mo>∼</mo>${msup(RE, frac(mn(3), mn(4)))}`, 'The time step must stop the fastest flow from skipping a cell (CFL), and a run lasts a few large-eddy turnovers. Points × steps: Re⁹ᐟ⁴ × Re³ᐟ⁴ = Re³. Doubling Re costs 8×.')
   ])}` }

 checks: {
  '0': [
   ['Fix 𝐤 but not i. What is ûᵢ(𝐤)?', ['A single real number', 'A vector in ℂ³, perpendicular to 𝐤', 'A 32³ array'], 1, 'One complex amplitude per axis, three in all; k_j û_j = 0 makes it perpendicular to 𝐤, so only two of them are free.'],
   ['Which operator mixes every grid point with every other one?', ['The FFT 𝓕', 'The derivative D = i kⱼ', 'The viscous factor V'], 0, 'Each Fourier coefficient is a sum over all N³ points. D and V act on each wave separately, and the product acts on each grid point separately.'],
   ['Why is the product u × ω taken on the grid and not in Fourier space?', ['It is more accurate on the grid', 'In Fourier space a product is a convolution: every wave pairs with every other, ∼N⁶ work. On the grid it is N³ multiplications plus FFTs', 'Fourier space has no vectors'], 1, 'That is the “pseudo” in pseudo-spectral: products where they are cheap, derivatives where they are exact.'],
   ['What does the 2/3 rule remove?', ['Waves with |kⱼ| > N/3, where the folded-back (aliased) parts of products land', 'The pressure', 'The mean flow'], 0, 'Products of kept waves reach at most 2N/3; anything above N/2 folds back, but only onto |k| > N/3, which is then zeroed.'],
   ['You double N in each direction. How much bigger is the state?', ['2×', '8×', '4×'], 1, 'N³ waves per component: 2³ = 8× the numbers (and with half the time step, about 16× the work).']
  ],
  A: [
   ['Which term makes Navier–Stokes nonlinear?', ['−∂ᵢp', 'uⱼ∂ⱼuᵢ (advection)', 'ν∂ⱼ∂ⱼuᵢ'], 1, 'Velocity carries itself: the product of u with its own gradient. It moves energy between scales and creates the small eddies.'],
   ['What decides the pressure in incompressible flow?', ['An equation of state p = ρRT', 'Whatever keeps ∂ᵢuᵢ = 0, everywhere at once (a Poisson equation)', 'The boundary conditions only'], 1, 'Pressure has no law of its own here; it is the constraint force that keeps the flow divergence-free.'],
   ['What does a DNS model?', ['The eddies smaller than the grid', 'Nothing: every eddy down to the dissipation scale is computed', 'The pressure'], 1, 'No turbulence model at all. The only errors are numerical ones, so the grid has to be fine enough.'],
   ['Taylor–Green at Re = 100 vs Re = 1000: what happens to the viscous term at the start?', ['It is 10× smaller relative to advection', 'It is the same', 'It is 10× larger'], 0, 'ν = 1/Re here. With weaker viscosity, smaller eddies survive, so the grid must be finer.'],
   ['If ∂ᵢuᵢ = 0 holds at t = 0, why does it need pressure to stay true?', ['Advection alone would create divergence; −∂ᵢp removes exactly that part', 'It does not: incompressibility holds by itself', 'Viscosity would break it'], 0, 'u·∇u is not divergence-free in general; the pressure gradient cancels its compressive part (block B shows this as the projection P).']
  ],
  B: [
   ['In Fourier space, ∂ⱼ becomes…', ['Multiplication by i kⱼ', 'A finite difference', 'Division by kⱼ'], 0, 'e^(ik·x) is an eigenfunction of ∂ⱼ with eigenvalue i kⱼ: a quarter-turn of phase and a stretch by kⱼ.'],
   ['Apply Pᵢⱼ to a vector parallel to 𝐤. What comes out?', ['The same vector', 'Zero', 'A vector twice as long'], 1, 'P removes the component along 𝐤 completely: that is the part pressure cancels.'],
   ['Why does the solver need no pressure Poisson solve?', ['Pressure is ignored', 'In Fourier space the Poisson equation is one division per wave, folded into Pᵢⱼ', 'It uses an iterative solver hidden in the FFT'], 1, '−k²p̂ = … is solved by dividing by k²: the projection does it for free.'],
   ['You switch the 2/3 rule off at high Re. What can happen?', ['Nothing changes', 'Aliased product terms put energy into the wrong waves, which can pile up and blow the run up', 'The run gets more accurate'], 1, 'Without dealiasing, fake modes feed energy into the smallest scales; with little viscosity to absorb it the simulation can become unstable.'],
   ['Why treat −νk²ûᵢ with the exact factor e^(−νk²Δt)?', ['It is cheaper than nothing', 'The highest k decay very fast; an explicit step would need a tiny Δt to stay stable', 'It adds a turbulence model'], 1, 'The linear viscous part is solved exactly, so only advection (CFL) limits Δt.']
  ],
  C: [
   ['Halve ν at the same ε. What happens to η?', ['Halves', 'Shrinks to 2^(−3/4) ≈ 0.59×', 'Stays the same'], 1, 'η = (ν³/ε)^{1/4}: (½)^{3/4} ≈ 0.59.'],
   ['k_max η drops to 0.3. What do you see in the spectrum?', ['Energy piles up near k_max instead of falling off', 'The spectrum gets steeper', 'Nothing'], 0, 'The cascade brings energy to scales the grid cannot hold and viscosity is too weak there; it accumulates at the cutoff. It is no longer a DNS.'],
   ['Why does total cost grow like Re³?', ['N³ ∼ Re⁹ᐟ⁴ points times Re³ᐟ⁴ time steps', 'The FFT is N²', 'Pressure solves get harder'], 0, 'Finer grid in all three directions, and a smaller time step to match.'],
   ['Taylor–Green at Re = 1600 (peak ε near t ≈ 9). Is 32³ enough?', ['Yes', 'No: k_max η is about 0.14; published references use 256³ to 512³', 'Only if Δt is tiny'], 1, 'At 32³ the run is badly under-resolved: the Build step lets you see the pile-up and the wrong dissipation peak.'],
   ['In the spectral solver, −dE/dt and 2νΩ agree even when under-resolved. Why?', ['The dealiased nonlinear term conserves energy exactly, so all loss is the resolved viscous loss: the check shows the numerics add no dissipation, not that the eddies are resolved', 'Because the run is always resolved', 'Because ν is large'], 0, 'That is why resolution is judged by k_max η, the spectrum tail, and a finer-grid reference.']
  ]
 },
 quiz: [
  ['What makes a simulation a DNS?', ['It uses a spectral method', 'Every scale of motion down to the Kolmogorov scale is computed; no turbulence model', 'It runs on a GPU'], 1, 'DNS is defined by resolution, not by the numerical method; spectral codes are just the most accurate way to get there in a box.'],
  ['Why do periodic-box DNS codes use Fourier pseudo-spectral methods?', ['Derivatives are exact for every resolved wave and pressure is one division per wave', 'They need no grid', 'They work for any geometry'], 0, 'Spectral accuracy plus a trivial Poisson solve; the price is periodic (or very simple) geometry.'],
  ['Re doubles. Roughly how much more work?', ['2×', '4×', '8×'], 2, 'Work ∼ Re³.'],
  ['What dominates a large parallel spectral DNS?', ['The pointwise products', 'The all-to-all transposes inside the 3D FFTs', 'Writing output'], 1, 'Every 3D FFT reshuffles the whole array across the machine; communication, not arithmetic, sets the speed at scale.'],
  ['Slab vs pencil decomposition on an N³ grid: how many ranks can each use?', ['Slab ≤ N, pencil ≤ N²', 'Both ≤ N', 'Slab ≤ N², pencil ≤ N³'], 0, 'A slab needs at least one plane per rank; a pencil needs at least one line.'],

 ],
 build: {
  intro: 'Put the steps of one Runge–Kutta stage in order. When it is right, your 3D pseudo-spectral DNS runs below: the Taylor–Green vortex on 32³ points.',
  html: `<div class="scrollx"><canvas class="sim" id="dns-sim" data-w="760" data-h="400" aria-label="Your 3D DNS: vorticity in the box, the dissipation rate two ways against a finer-grid reference, and the energy spectrum"></canvas></div>
   <div class="row"><label for="dns-re">Re = <span id="dns-rev">100</span></label><input type="range" id="dns-re" min="0" max="5" step="1" value="1"><button class="b" id="dns-run">Pause</button><button class="b" id="dns-restart">Restart</button></div>
   <div class="note" id="dns-simcap">&nbsp;</div>
   <details><summary>What the curves prove, and what they do not</summary><p>−dE/dt (dots, from the energy history) and 2νΩ (line, from the enstrophy) agree to about 0.1 % at every Re: the dealiased spectral scheme adds no numerical dissipation, so all energy loss is the resolved viscous loss. That checks the numerics, not the resolution. Resolution shows in k<sub>max</sub>η and in the spectrum tail, and in the dashed finer-grid reference (computed offline with this same code at 64³ or 128³): at Re ≥ 400 the 32³ run leaves it. The Re = 1600 case is the standard benchmark (peak ε ≈ 0.0127 near t ≈ 9 with 512³ spectral references); 32³ cannot get it.</p></details>`,
  steps: ['Vorticity in Fourier space: ω̂ = i𝐤 × û', 'Inverse FFT: û, ω̂ → u, ω on the grid', 'Multiply on the grid: u × ω', 'FFT back, zero |kⱼ| > N/3 (2/3 rule)', 'Project with Pᵢⱼ (pressure part removed)', 'RK update with viscous factor e^(−νk²Δt)'],
  hint: 'Derivatives are taken in Fourier space, products on the grid; the projection acts on the transformed, dealiased product; viscosity comes last with the update.',
  success: 'Your 3D DNS is running: 32³ Fourier modes, 5 FFTs per stage, 3 stages per step. Watch the vortex sheets roll up, ε rise to its peak, and the spectrum fill toward k_max. Slide Re up until k_max η falls below 1.'
 },
 parallel: {
  html: `<div class="par"><div class="stack">
     <p><strong>FFTs dominate.</strong> Each stage does five 3D FFTs (15 per step). A 3D FFT is 1D FFTs along x, then y, then z, and each pass needs whole lines in one memory.</p>
     <p><strong>Slab:</strong> each rank holds N/P planes. x and y are local; z needs one global <em>transpose</em> (all-to-all). At most N ranks: one plane each.</p>
     <p><strong>Pencil:</strong> each rank holds a column N × N/P₁ × N/P₂. Two transposes, each inside a row or column group of ranks. Up to N² ranks.</p>
     <p>Every transpose moves the whole array across the network, so at scale DNS is <strong>communication-bound</strong>.</p></div>
   <canvas id="dns-decomp" data-w="320" data-h="250" style="width:100%;max-width:320px;border-radius:8px;background:var(--bg)" aria-label="The N³ grid cut into slabs or pencils, one colour per rank, with the transpose that swaps their orientation"></canvas></div>
   <h3 style="font-size:16px">Fit a grid onto a machine</h3>
   <p>Pick a grid and a number of ranks. Find a setup where slabs run out but pencils still work.</p>
   <div class="btns"><button class="b pri" id="dns-slab">Slab</button><button class="b" id="dns-pencil">Pencil</button></div>
   <div class="ctl"><label for="dns-pn" class="sym" style="color:var(--ink)">N</label><input type="range" id="dns-pn" min="5" max="14" step="1" value="10"><output id="dns-pnv">1024</output></div>
