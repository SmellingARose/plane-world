# CI: macOS arm64 (Metal) + Windows x64 (MSVC, Direct3D 12 / WARP); tag pushes draft a release.
name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  QT_VERSION: "6.8.3"
  SLANG_VERSION: "2026.18.3"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            name: macos-arm64
            slang_asset: macos-aarch64.tar.gz
          - os: windows-latest
            name: windows-x64
            slang_asset: windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Slang ${{ env.SLANG_VERSION }} (official release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/slang" && cd "$RUNNER_TEMP/slang"
          gh release download "v$SLANG_VERSION" -R shader-slang/slang -p "slang-$SLANG_VERSION-${{ matrix.slang_asset }}" -O slang.archive
          if [[ "${{ matrix.slang_asset }}" == *.zip ]]; then unzip -q slang.archive; else tar xzf slang.archive; fi
          echo "SLANG_DIR=$RUNNER_TEMP/slang" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/slang/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Unit + parity tests (pwtests)
        env:
          PW_GPU_WARP: ${{ runner.os == 'Windows' && '1' || '' }}
          PW_SHOT_DIR: ${{ github.workspace }}/shots
        run: mkdir -p shots && build/tests/pwtests

      - name: Self-tests (pwcli --selftest all)
        env:
          PW_SELFTEST_OUT: shots   # env scene screenshots (envrender.scene) land in the uploaded artefacts
          PW_FLOW_SMALL: ${{ runner.os == 'Windows' && '1' || '' }}   # WARP: flow.* on coarse grids (full grids take minutes each)
        run: build/src/cli/pwcli --selftest all --verbose

      - name: Training parity vs reference histories (examples/experiments, 1 and 4 workers)
        run: bash tools/train_parity.sh build/src/cli/pwcli ${{ runner.os == 'Windows' && 'loose' || 'exact' }}

      - name: Direct3D 12 WARP smoke test
        if: runner.os == 'Windows'
        run: build/src/cli/pwcli --gpu-smoke --warp

      - name: Renderer screenshot (WARP Direct3D 12)
        if: runner.os == 'Windows'
        run: build/src/cli/pwcli --render-shot shots/pwcli-warp-640x360.png --warp

      - name: Metal smoke test
        if: runner.os == 'macOS'
        run: build/src/cli/pwcli --gpu-smoke || echo "::warning::no Metal device on this runner"

      - name: WORLD / EVOLVE view models (pwuitests)
        env:
          QT_QPA_PLATFORM: offscreen
        run: build/src/app/pwuitests

      - name: Benchmarks
        run: build/src/cli/pwcli --bench all --reps 1 --json build/bench.json

      - name: Deploy app
        run: cmake --build build --target pwapp_deploy

      - name: App launch smoke (screenshot)
        env:
          QSG_RHI_PREFER_SOFTWARE_RENDERER: "1"
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            "build/src/app/Plane World.app/Contents/MacOS/Plane World" --quit-after 5 --screenshot app-${{ matrix.name }}.png --tab fly
          else
            pwsh -Command '$p = Start-Process -FilePath "build/deploy/Plane World.exe" -ArgumentList "--quit-after","5","--screenshot","app-${{ matrix.name }}.png","--tab","fly" -PassThru -Wait; exit $p.ExitCode'
          fi
          ls -la app-${{ matrix.name }}.png

      - name: App launch smoke, WORLD and EVOLVE tabs
        env:
          QSG_RHI_PREFER_SOFTWARE_RENDERER: "1"
        run: |
          for t in world evolve; do
            if [[ "$RUNNER_OS" == "macOS" ]]; then
              "build/src/app/Plane World.app/Contents/MacOS/Plane World" --quit-after 6 --screenshot app-${{ matrix.name }}-$t.png --tab $t
            else
              pwsh -Command "\$p = Start-Process -FilePath 'build/deploy/Plane World.exe' -ArgumentList '--quit-after','6','--screenshot','app-${{ matrix.name }}-$t.png','--tab','$t' -PassThru -Wait; exit \$p.ExitCode"
            fi
            ls -la app-${{ matrix.name }}-$t.png
          done

      - name: Installer (macOS .dmg, ad-hoc signed)
        if: runner.os == 'macOS'
        run: packaging/macos/make_dmg.sh build dist

      - name: Installer (Windows .msi, WiX v5)
        if: runner.os == 'Windows'
        run: |
          dotnet tool install --global wix --version 5.0.2
          echo "$USERPROFILE/.dotnet/tools" >> "$GITHUB_PATH"
          export PATH="$USERPROFILE/.dotnet/tools:$PATH"
          packaging/windows/make_msi.sh build dist

      - name: Installer smoke (install, launch, uninstall)
        env:
          QSG_RHI_PREFER_SOFTWARE_RENDERER: "1"
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            M=$(mktemp -d); hdiutil attach -nobrowse -mountpoint "$M" dist/*.dmg
            cp -R "$M/Plane World.app" "$RUNNER_TEMP/"; hdiutil detach "$M"
            "$RUNNER_TEMP/Plane World.app/Contents/MacOS/pwcli" --info
            "$RUNNER_TEMP/Plane World.app/Contents/MacOS/Plane World" --quit-after 5 --screenshot installed-${{ matrix.name }}.png --tab build
          else
            MSI=$(cygpath -w dist/*.msi)
            pwsh -Command "\$p = Start-Process msiexec -ArgumentList '/i','$MSI','/qn','/l*v','msi.log' -PassThru -Wait; exit \$p.ExitCode" || { tail -50 msi.log; exit 1; }
            ls -la "/c/Program Files/Plane World" || { iconv -f UTF-16LE -t UTF-8 msi.log | grep -iE "error|return value 3|INSTALLFOLDER|Plane World.exe" | head -40; exit 1; }
            "/c/Program Files/Plane World/pwcli.exe" --info
            pwsh -Command "\$p = Start-Process -FilePath 'C:/Program Files/Plane World/Plane World.exe' -ArgumentList '--quit-after','5','--screenshot','installed-${{ matrix.name }}.png','--tab','build' -PassThru -Wait; exit \$p.ExitCode"
            pwsh -Command "\$p = Start-Process msiexec -ArgumentList '/x','$MSI','/qn' -PassThru -Wait; exit \$p.ExitCode"
            test ! -e "/c/Program Files/Plane World/Plane World.exe"
          fi
          ls -la installed-${{ matrix.name }}.png

      - name: Package artefacts
        run: |
          mkdir -p dist
          rm -rf dist/stage
          cp installed-${{ matrix.name }}.png dist/
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            ditto -c -k --keepParent "build/src/app/Plane World.app" "dist/PlaneWorld-${{ matrix.name }}.zip"
            cp build/src/cli/pwcli dist/
          else
            cp build/src/cli/pwcli.exe dist/
            pwsh -Command 'Compress-Archive -Path "build/deploy/*" -DestinationPath "dist/PlaneWorld-${{ matrix.name }}.zip"'
          fi
          cp build/bench.json dist/bench-${{ matrix.name }}.json
          cp app-${{ matrix.name }}*.png dist/ 2>/dev/null || true
          cp shots/*.png dist/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: planeworld-${{ matrix.name }}
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefacts
      - name: Draft GitHub release with installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" --draft --generate-notes \
            --title "Plane World ${GITHUB_REF_NAME}" \
            artefacts/*/*.dmg artefacts/*/*.msi artefacts/*/PlaneWorld-*.zip
