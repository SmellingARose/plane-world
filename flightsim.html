<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Plane World</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#14171c;--panel:#1d2128;--line:#2c323c;--text:#e6e9ee;--dim:#8a93a2;--acc:#4da3ff;--warn:#ff6a4d}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:13px/1.4 -apple-system,system-ui,sans-serif}
#top{position:fixed;top:0;left:0;right:0;height:44px;display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line);z-index:10}
#top .tab{padding:6px 16px;border-radius:6px;cursor:pointer;color:var(--dim);font-weight:600}
#top .tab.on{background:var(--acc);color:#fff}
#top input{background:var(--bg);border:1px solid var(--line);color:var(--text);padding:5px 8px;border-radius:6px;width:200px}
#top .sp{flex:1}
canvas{position:fixed;top:44px;left:0;display:block}
.side{position:fixed;top:44px;bottom:0;width:290px;background:var(--panel);overflow-y:auto;padding:10px;z-index:5}
#left{left:0;border-right:1px solid var(--line)} #right{right:0;border-left:1px solid var(--line)}
h3{margin:14px 0 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
h3:first-child{margin-top:0}
button{background:#2a303a;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:5px 8px;cursor:pointer;font:inherit}
button:hover{border-color:var(--acc)}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px}
.row{display:flex;gap:4px;margin:3px 0;align-items:center}
.row label{width:110px;color:var(--dim);flex:none}
.row input,.row select{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);color:var(--text);padding:3px 5px;border-radius:4px;font:inherit}
.row input[type=checkbox]{flex:none}
.item{padding:4px 6px;border-radius:4px;cursor:pointer;display:flex;justify-content:space-between}
.item:hover{background:#262b33} .item.sel{background:#21406a}
.tag{color:var(--dim);font-size:11px}
.out{display:flex;gap:4px;align-items:center;margin:3px 0}
.out input{flex:1;background:var(--bg);border:1px solid var(--line);color:var(--text);padding:3px 5px;border-radius:4px}
#flyPanel{position:fixed;left:0;top:44px;bottom:0;width:300px;background:rgba(20,23,28,.88);padding:12px;overflow-y:auto;z-index:5;display:none}
.slider{margin:8px 0 12px}
.slider .lbl{display:flex;justify-content:space-between;font-weight:600}
.slider .lbl .v{color:var(--acc);font-variant-numeric:tabular-nums}
.slider .lbl .warn{color:var(--warn)}
.slider input{width:100%}
#hud{position:fixed;right:12px;top:56px;background:rgba(0,0,0,.5);padding:10px 12px;border-radius:8px;font:12px/1.5 ui-monospace,Menlo,monospace;white-space:pre;display:none;pointer-events:none;z-index:5}
#hint{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);color:var(--dim);font-size:12px;z-index:5;background:rgba(0,0,0,.4);padding:4px 10px;border-radius:6px}
</style>
</head>
<body>
<div id="top">
  <div class="tab on" data-tab="build">Build</div>
  <div class="tab" data-tab="fly">Fly</div>
  <input id="craftName" placeholder="Craft name">
  <span class="sp"></span>
  <span class="tag" id="massInfo"></span>
</div>

<div id="left" class="side">
  <h3>Add part</h3>
  <div class="grid" id="addBtns"></div>
  <div class="row" style="margin-top:6px"><button id="cadBtn" style="flex:1">Import CAD (.stl / .obj)</button></div>
  <input type="file" id="cadFile" accept=".stl,.obj" hidden>
  <h3>Parts</h3>
  <div id="partList"></div>
  <h3>Library</h3>
  <div class="row"><button id="saveBtn" style="flex:1">Save to library</button><button id="newBtn">New</button></div>
  <div class="row"><button id="exportBtn" style="flex:1">Export .json</button><button id="importBtn" style="flex:1">Import .json</button></div>
  <input type="file" id="importFile" accept=".json" hidden>
  <div id="library"></div>
</div>

<div id="right" class="side">
  <h3>Properties</h3>
  <div id="props"><span class="tag">Select a part</span></div>
  <h3>Outputs</h3>
  <div class="tag" style="margin-bottom:4px">Every servo, motor and engine is an output. These names become the sliders in Fly.</div>
  <div id="outputs"></div>
</div>

<div id="flyPanel"><h3 id="flyTitle">Outputs</h3><div id="sliders"></div>
  <div class="tag" style="margin-top:16px">Drag to orbit camera · R reset · P pause</div></div>
<div id="hud"></div>
<div id="hint">Click a part to select · gizmo: T move / Y rotate · Del delete · D duplicate</div>

<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { TransformControls } from 'three/addons/controls/TransformControls.js';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';

const V = (x=0,y=0,z=0)=>new THREE.Vector3(x,y,z);
const DEG = Math.PI/180, G = 9.81;
const $ = id=>document.getElementById(id);
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
function atmosphere(h){
  const T = 288.15 - 0.0065*clamp(h,0,11000);
  const p = 101325*Math.pow(T/288.15, 5.2559);
  return { rho: p/(287.05*T) };
}

// =====================================================================
// PART TYPES   (craft frame: +x forward, +y up, +z right)
// =====================================================================
const TYPES = {
  box:     { label:'Box',       color:'#d8dce2', mass:20, p:{sx:1,sy:0.5,sz:0.5,cd:0.3} },
  cylinder:{ label:'Cylinder',  color:'#d8dce2', mass:20, p:{r:0.3,h:2,cd:0.3} },
  cone:    { label:'Cone',      color:'#d8dce2', mass:5,  p:{r:0.3,h:0.8,cd:0.2} },
  sphere:  { label:'Sphere',    color:'#d8dce2', mass:10, p:{r:0.4,cd:0.2} },
  wing:    { label:'Wing/Fin',  color:'#e8eaee', mass:30, p:{span:4,chord:1.2,thick:0.1,camber:0.2,ar:7} },
  servo:   { label:'Servo',     color:'#ffb020', mass:0.5,p:{axis:'z',range:25,torque:300,speed:90} },
  wheel:   { label:'Wheel',     color:'#222428', mass:8,  p:{r:0.3,width:0.15,grip:0.9,roll:0.02} },
  motor:   { label:'Motor',     color:'#5a6270', mass:40, p:{torque:150,vmax:20,reversible:0} },
  prop:    { label:'Propeller', color:'#333',    mass:8,  p:{d:1.8,thrust:2500,vmax:80} },
  jet:     { label:'Jet engine',color:'#7d858f', mass:150,p:{thrust:8000,flow:0.25,r:0.35,len:2} },
  tank:    { label:'Fuel tank', color:'#c9a24a', mass:20, p:{capacity:200,fill:1,r:0.3,len:1.5} },
  solid:   { label:'Solid rocket',color:'#e0e0e0',mass:3, p:{thrust:900,burn:4,fuel:10,r:0.1,len:0.8} },
  cad:     { label:'CAD',       color:'#a8c4e0', mass:20, p:{scale:1,cd:0.3} },
};
const OUTPUT_TYPES = ['servo','motor','jet','solid'];
const BODY_TYPES = ['box','cylinder','cone','sphere','cad','motor','jet','tank','solid','servo'];
const FIELD_LABELS = { sx:'Size X',sy:'Size Y',sz:'Size Z',r:'Radius',h:'Height',cd:'Drag coef',span:'Span',chord:'Chord',thick:'Thickness',
  camber:'Cl₀ (camber)',ar:'Aspect ratio',axis:'Hinge axis',range:'Range ±°',torque:'Torque N·m',speed:'Speed °/s',width:'Width',grip:'Grip μ',
  roll:'Rolling μ',reversible:'Reversible',d:'Diameter',thrust:'Thrust N',vmax:'Max speed m/s',flow:'Fuel flow kg/s',len:'Length',
  capacity:'Capacity kg',fill:'Fill 0–1',burn:'Burn time s',fuel:'Propellant kg',scale:'Scale' };
const SELECTS = { axis:['x','y','z'], reversible:[0,1] };

let nextId = 1;
function newPart(type, o={}){
  const T = TYPES[type];
  return Object.assign({ id:'p'+(nextId++)+Math.random().toString(36).slice(2,6), type, name:T.label, color:T.color, mass:T.mass,
    pos:[0,0,0], rot:[0,0,0], p:{...T.p}, servo:null, invert:false, motor:null }, o, { p:{...T.p, ...(o.p||{})} });
}

// ---------- CAD data <-> base64 ----------
function f32ToB64(arr){ const u=new Uint8Array(arr.buffer); let s=''; for(let i=0;i<u.length;i+=0x8000) s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000)); return btoa(s); }
function b64ToF32(b){ const s=atob(b), u=new Uint8Array(s.length); for(let i=0;i<s.length;i++) u[i]=s.charCodeAt(i); return new Float32Array(u.buffer); }
const cadCache = new Map();

// ---------- geometry for each part (in part-local frame) ----------
function makeGeo(part){
  const p = part.p; let g;
  switch(part.type){
    case 'box': g=new THREE.BoxGeometry(p.sx,p.sy,p.sz); break;
    case 'cylinder': g=new THREE.CylinderGeometry(p.r,p.r,p.h,24); break;
    case 'cone': g=new THREE.CylinderGeometry(0.001,p.r,p.h,24); break;
    case 'sphere': g=new THREE.SphereGeometry(p.r,24,16); break;
    case 'wing': g=new THREE.BoxGeometry(p.chord,p.thick,p.span); break;
    case 'servo': g=new THREE.BoxGeometry(0.14,0.08,0.08); break;
    case 'wheel': g=new THREE.CylinderGeometry(p.r,p.r,p.width,24).rotateX(Math.PI/2); break;
    case 'motor': g=new THREE.CylinderGeometry(0.22,0.25,0.5,16).rotateZ(Math.PI/2); break;
    case 'prop': g=new THREE.BoxGeometry(0.06,p.d,0.14); break;
    case 'jet': g=new THREE.CylinderGeometry(p.r*0.75,p.r,p.len,20).rotateZ(Math.PI/2); break;
    case 'tank': g=new THREE.CapsuleGeometry(p.r,Math.max(0.01,p.len-2*p.r),6,16).rotateZ(Math.PI/2); break;
    case 'solid': g=new THREE.CylinderGeometry(p.r*0.8,p.r,p.len,16).rotateZ(Math.PI/2); break;
    case 'cad': {
      let pos = cadCache.get(part.cad); if(!pos){ pos=b64ToF32(part.cad); cadCache.set(part.cad,pos); }
      g=new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos.slice(),3));
      g.scale(p.scale,p.scale,p.scale); g.computeVertexNormals(); break;
    }
  }
  g.computeBoundingBox(); return g;
}
const eulerQ = rot => new THREE.Quaternion().setFromEuler(new THREE.Euler(rot[0]*DEG,rot[1]*DEG,rot[2]*DEG,'XYZ'));
function rotFromBasis(x,y,z){ const e=new THREE.Euler().setFromRotationMatrix(new THREE.Matrix4().makeBasis(x,y,z),'XYZ'); return [e.x/DEG,e.y/DEG,e.z/DEG].map(v=>Math.round(v*100)/100); }

// =====================================================================
// PRESETS
// =====================================================================
function presetPlane(){
  const parts=[], add=(t,o)=>{ const p=newPart(t,o); parts.push(p); return p; };
  const ail = add('servo',{name:'Ailerons', pos:[0.4,0.6,0], p:{axis:'z',range:20,torque:400,speed:120}});
  const elev= add('servo',{name:'Elevator', pos:[-3.6,0.2,0], p:{axis:'z',range:20,torque:400,speed:120}});
  const rud = add('servo',{name:'Rudder',   pos:[-3.6,0.9,0], p:{axis:'y',range:25,torque:400,speed:120}});
  const eng = add('motor',{name:'Engine', pos:[3.2,0,0], mass:120, p:{torque:300}});
  add('box',{name:'Fuselage', pos:[0,0,0], mass:330, p:{sx:6,sy:1.1,sz:1.1,cd:0.12}});
  add('cone',{name:'Spinner', pos:[3.55,0,0], rot:[0,0,-90], mass:2, p:{r:0.3,h:0.4,cd:0.1}});
  add('prop',{name:'Propeller', pos:[3.7,0,0], motor:eng.id, p:{d:1.9,thrust:2800,vmax:75}});
  add('wing',{name:'Wing L', pos:[0.4,0.6,-2.6], rot:[0,0,2], mass:45, p:{span:4.2,chord:1.5,camber:0.25,ar:7}});
  add('wing',{name:'Wing R', pos:[0.4,0.6, 2.6], rot:[0,0,2], mass:45, p:{span:4.2,chord:1.5,camber:0.25,ar:7}});
  add('wing',{name:'Aileron L', pos:[0.4,0.6,-5.45], rot:[0,0,2], mass:6, servo:ail.id, color:'#c0302a', p:{span:1.5,chord:1.3,camber:0.25,ar:7}});
  add('wing',{name:'Aileron R', pos:[0.4,0.6, 5.45], rot:[0,0,2], mass:6, servo:ail.id, invert:true, color:'#c0302a', p:{span:1.5,chord:1.3,camber:0.25,ar:7}});
  add('wing',{name:'Stabilator', pos:[-3.6,0.2,0], rot:[0,0,-1.5], mass:15, servo:elev.id, invert:true, color:'#c0302a', p:{span:3.4,chord:1.0,camber:0,ar:4}});
  add('wing',{name:'Fin', pos:[-3.6,0.95,0], rot:[90,0,0], mass:10, servo:rud.id, color:'#c0302a', p:{span:1.5,chord:1.1,camber:0,ar:2}});
  add('wheel',{name:'Nose wheel', pos:[2.2,-1.0,0], servo:rud.id, invert:true, p:{r:0.25}});
  add('wheel',{name:'Main L', pos:[-0.2,-1.0,-1.3]});
  add('wheel',{name:'Main R', pos:[-0.2,-1.0, 1.3]});
  return { name:'Trainer', parts };
}
function presetRocket(){
  const parts=[], add=(t,o)=>{ const p=newPart(t,o); parts.push(p); return p; };
  const up=V(0,1,0);
  add('cylinder',{name:'Body tube', pos:[0,1.7,0], mass:6, p:{r:0.12,h:3,cd:0.15}});
  add('cone',{name:'Nose cone', pos:[0,3.5,0], mass:1.5, color:'#c0302a', p:{r:0.12,h:0.6,cd:0.1}});
  add('solid',{name:'Booster', pos:[0,0.45,0], rot:[0,0,90], p:{thrust:700,burn:5,fuel:10,r:0.1,len:0.9}});
  const fin=(dx,dz)=>{ const span=V(dx,0,dz); add('wing',{name:'Fin', pos:[dx*0.3,0.35,dz*0.3], rot:rotFromBasis(up, span.clone().cross(up).negate(), span), mass:0.5, color:'#c0302a', p:{span:0.3,chord:0.5,thick:0.02,camber:0,ar:1.2}}); };
  fin(1,0); fin(-1,0); fin(0,1); fin(0,-1);
  return { name:'Sounding rocket', parts };
}
function presetRover(){
  const parts=[], add=(t,o)=>{ const p=newPart(t,o); parts.push(p); return p; };
  const drive = add('motor',{name:'Drive', pos:[0,0,0], mass:30, p:{torque:180,reversible:1}});
  const steer = add('servo',{name:'Steering', pos:[0.9,0,0], p:{axis:'y',range:30,torque:200,speed:60}});
  add('box',{name:'Chassis', pos:[0,0.1,0], mass:150, p:{sx:2.4,sy:0.4,sz:1.3,cd:0.6}});
  for (const [x,z] of [[0.9,-0.85],[0.9,0.85],[-0.9,-0.85],[-0.9,0.85]])
    add('wheel',{name:(x>0?'Front ':'Rear ')+(z<0?'L':'R'), pos:[x,-0.15,z], motor:drive.id, servo:x>0?steer.id:null, invert:true, p:{r:0.35,width:0.2,grip:1.0}});
  return { name:'Rover', parts };
}
function presetJet(){
  const c = presetPlane(); c.name='Jet trainer';
  c.parts = c.parts.filter(p=>!['prop','motor','cone'].includes(p.type));
  c.parts.push(newPart('jet',{name:'Turbojet', pos:[0.5,0,0], mass:180, p:{thrust:4500,flow:0.18,r:0.35,len:2}}));
  c.parts.push(newPart('tank',{name:'Fuel tank', pos:[1.8,0,0], mass:15, p:{capacity:250,fill:1,r:0.35,len:1.6}}));
  c.parts.find(p=>p.name==='Fuselage').mass = 250;
  return c;
}

// =====================================================================
// PHYSICS: build a rigid-body sim from parts
// =====================================================================
const AX = { x:V(1,0,0), y:V(0,1,0), z:V(0,0,1) };
function prepParts(craft){
  return craft.parts.map(src=>{
    const p = structuredClone(src);
    const geo = makeGeo(p); const bb = geo.boundingBox;
    p.geo = geo; p.size = bb.getSize(V()); p.ctr = bb.getCenter(V());
    p.basePos = V(...p.pos); p.baseQ = eulerQ(p.rot);
    p.effQ = p.baseQ.clone(); p.o = V(); p.r = V();
    p.angle = 0; p.load = 0; p.out = 0; p.spin = 0; p.thrustNow = 0;
    if (p.type==='tank') p.fuelKg = p.p.capacity*clamp(p.p.fill,0,1);
    if (p.type==='solid'){ p.fuelKg = p.p.fuel; p.burning=false; }
    return p;
  });
}
const partMass = p => p.mass + (p.fuelKg||0);
function massProps(parts){
  let M=0; const com=V();
  for (const p of parts){ const m=partMass(p); M+=m; com.addScaledVector(p.basePos.clone().add(p.ctr.clone().applyQuaternion(p.baseQ)), m); }
  com.divideScalar(Math.max(M,1e-6));
  const I = new Array(9).fill(0);
  const R = new THREE.Matrix3(), D = new THREE.Matrix3(), m4 = new THREE.Matrix4();
  for (const p of parts){
    const m=partMass(p), s=p.size;
    D.set(m/12*(s.y*s.y+s.z*s.z),0,0, 0,m/12*(s.x*s.x+s.z*s.z),0, 0,0,m/12*(s.x*s.x+s.y*s.y));
    R.setFromMatrix4(m4.makeRotationFromQuaternion(p.baseQ));
    const Ip = R.clone().multiply(D).multiply(R.clone().transpose()).elements;
    const d = p.basePos.clone().add(p.ctr.clone().applyQuaternion(p.baseQ)).sub(com), dd=d.dot(d), da=[d.x,d.y,d.z];
    for (let i=0;i<3;i++) for (let j=0;j<3;j++) I[i*3+j] += Ip[j*3+i] + m*((i===j?dd:0) - da[i]*da[j]);
  }
  for (let i=0;i<3;i++) I[i*4] += 0.5; // keep invertible
  const Im = new THREE.Matrix3().set(...I);
  return { M, com, I:Im, Iinv: Im.clone().invert() };
}

function liftCoef(a, p){
  const slope = 2*Math.PI*p.ar/(p.ar+2), stall = 15*DEG;
  const lin = p.camber + slope*a;
  const flat = 1.05*Math.sin(2*a);
  const ex = Math.abs(a) - stall;
  if (ex <= 0) return { cl:lin, stalled:false };
  const t = clamp(ex/(12*DEG),0,1);
  return { cl:(p.camber + slope*stall*Math.sign(a))*(1-t) + flat*t, stalled:true };
}

function createSim(craft){
  const parts = prepParts(craft);
  const byId = Object.fromEntries(parts.map(p=>[p.id,p]));
  const sim = { parts, byId, pos:V(), vel:V(), q:new THREE.Quaternion(), w:V(), t:0, aoa:0, stalled:false };
  Object.assign(sim, massProps(parts));
  // contact points for rigid parts: bounding-box corners (part local)
  for (const p of parts){
    p.corners = [];
    if (BODY_TYPES.includes(p.type) || p.type==='wing'){
      const h = p.size.clone().multiplyScalar(0.5);
      for (const sx of [-1,1]) for (const sy of [-1,1]) for (const sz of [-1,1]) p.corners.push(p.ctr.clone().add(V(sx*h.x,sy*h.y,sz*h.z)));
    }
  }
  resetSim(sim);
  return sim;
}
function resetSim(sim){
  let minY = Infinity;
  for (const p of sim.parts){
    for (const c of p.corners) minY = Math.min(minY, p.basePos.y + c.clone().applyQuaternion(p.baseQ).y);
    if (p.type==='wheel') minY = Math.min(minY, p.basePos.y - p.p.r);
  }
  for (const p of sim.parts){ p.angle=0; p.spin=0; if(p.type==='tank') p.fuelKg=p.p.capacity*clamp(p.p.fill,0,1); if(p.type==='solid'){p.fuelKg=p.p.fuel;p.burning=false;} }
  Object.assign(sim, massProps(sim.parts));
  sim.q.identity(); sim.vel.set(0,0,0); sim.w.set(0,0,0); sim.t=0;
  sim.pos.set(0, -minY + 0.02, 0).add(sim.com);
}

const tmpQ = new THREE.Quaternion();
function step(sim, dt){
  const { parts, byId } = sim;
  const atm = atmosphere(sim.pos.y), rr = atm.rho/1.225;

  // --- servos: move toward commanded angle, limited by speed and torque vs. aero load
  for (const s of parts) if (s.type==='servo'){
    const tgt = clamp(s.out,-1,1)*s.p.range*DEG, cap = Math.max(1e-3, s.p.torque), load = s.load;
    s.overload = load > cap;
    if (!s.overload){ const rate = s.p.speed*DEG*(1-0.8*load/cap); s.angle += clamp(tgt-s.angle, -rate*dt, rate*dt); }
    else { const rate = s.p.speed*DEG*Math.min(1, load/cap-1); s.angle += clamp(-s.angle, -rate*dt, rate*dt); }
    s.loadShown = load; s.load = 0;
  }
  // --- effective transforms (servo-driven parts rotate about their own origin)
  for (const p of parts){
    p.effQ.copy(p.baseQ);
    const s = p.servo && byId[p.servo];
    if (s){ const axis = AX[s.p.axis].clone().applyQuaternion(s.baseQ); tmpQ.setFromAxisAngle(axis, s.angle*(p.invert?-1:1)); p.effQ.premultiply(tmpQ); }
    p.o.copy(p.basePos).sub(sim.com);
    p.r.copy(p.ctr).applyQuaternion(p.effQ).add(p.o);
  }

  const qInv = sim.q.clone().invert();
  const vB = sim.vel.clone().applyQuaternion(qInv);
  const F = V(), Mo = V();
  const ptVel = r => vB.clone().add(sim.w.clone().cross(r));
  const apply = (f, r)=>{ F.add(f); Mo.add(r.clone().cross(f)); };
  let liquid = 0; for (const p of parts) if (p.type==='tank') liquid += p.fuelKg;
  let liquidUse = 0;
  sim.stalled = false;

  for (const p of parts){
    p.thrustNow = 0;
    if (p.type==='wing'){
      const n = V(0,1,0).applyQuaternion(p.effQ), c = V(1,0,0).applyQuaternion(p.effQ), s = V(0,0,1).applyQuaternion(p.effQ);
      const ac = p.o.clone().addScaledVector(c, p.p.chord*0.25);
      const air = ptVel(ac).negate(); air.addScaledVector(s, -air.dot(s));
      const sp = air.length(); if (sp < 0.3) continue;
      const a = Math.atan2(air.dot(n), -air.dot(c));
      const { cl, stalled } = liftCoef(a, p.p);
      if (stalled && p.p.span*p.p.chord > 2) sim.stalled = true;
      const cd = 0.01 + cl*cl/(Math.PI*p.p.ar*0.8) + (stalled?1.2*Math.sin(a)**2:0) + 0.02*Math.sin(a)**2;
      const qS = 0.5*atm.rho*sp*sp*p.p.span*p.p.chord;
      const dd = air.clone().divideScalar(sp), ld = dd.clone().cross(s).normalize();
      const f = ld.multiplyScalar(cl*qS).addScaledVector(dd, cd*qS);
      // flat-plate drag on the thin side (sideslip into a wing)
      apply(f, ac);
      if (p.servo && byId[p.servo]) byId[p.servo].load += f.length()*0.12*p.p.chord + Math.abs(cl)*qS*0.02;
    } else if (BODY_TYPES.includes(p.type)){
      const v = ptVel(p.r), sp = v.length(); if (sp > 0.1){
      const vl = v.clone().applyQuaternion(p.effQ.clone().invert()).divideScalar(sp), s = p.size;
      const A = Math.abs(vl.x)*s.y*s.z + Math.abs(vl.y)*s.x*s.z + Math.abs(vl.z)*s.x*s.y;
      const cd = p.p.cd ?? 0.3;
      apply(v.multiplyScalar(-0.5*atm.rho*sp*cd*A), p.r); }
    }
    if (p.type==='prop'){
      const m = p.motor && byId[p.motor]; const thr = m ? clamp(m.out,-1,1) : 0;
      const dir = V(1,0,0).applyQuaternion(p.effQ), vax = ptVel(p.o).dot(dir);
      const T = p.p.thrust*thr*rr*Math.max(0, 1 - Math.abs(vax)/p.p.vmax);
      p.thrustNow = Math.abs(thr); p.spin += thr*60*dt;
      apply(dir.multiplyScalar(T), p.o);
      if (m) Mo.addScaledVector(V(1,0,0).applyQuaternion(p.effQ), -T*0.01); // torque reaction
    }
    if (p.type==='jet'){
      const thr = clamp(p.out,0,1);
      if (liquid > 0 && thr > 0){
        const dir = V(1,0,0).applyQuaternion(p.effQ);
        apply(dir.multiplyScalar(p.p.thrust*thr*rr), p.o); p.thrustNow = thr;
        liquidUse += p.p.flow*thr*dt;
      }
    }
    if (p.type==='solid'){
      if (!p.burning && p.out > 0.5 && p.fuelKg > 0) p.burning = true;
      if (p.burning){
        const dir = V(1,0,0).applyQuaternion(p.effQ);
        apply(dir.multiplyScalar(p.p.thrust), p.o); p.thrustNow = 1;
        p.fuelKg -= p.p.fuel/p.p.burn*dt;
        if (p.fuelKg <= 0){ p.fuelKg = 0; p.burning = false; }
      }
    }
  }
  if (liquidUse > 0 && liquid > 0){ const k = Math.max(0, 1 - liquidUse/liquid); for (const p of parts) if (p.type==='tank') p.fuelKg *= k; }

  // --- to world, gravity
  const Fw = F.applyQuaternion(sim.q); Fw.y -= sim.M*G;
  const Mw = V(); // world-frame moments from contacts
  const wW = sim.w.clone().applyQuaternion(sim.q);
  const up = V(0,1,0);

  // --- ground: rigid contact points
  const kB = sim.M*300, cB = sim.M*10;
  for (const p of parts){
    if (!p.corners.length) continue;
    for (const c of p.corners){
      const rB = c.clone().applyQuaternion(p.effQ).add(p.o);
      const rW = rB.applyQuaternion(sim.q);
      const y = sim.pos.y + rW.y; if (y >= 0) continue;
      const vp = sim.vel.clone().add(wW.clone().cross(rW));
      const N = Math.max(0, -y*kB - vp.y*cB);
      const vt = V(vp.x,0,vp.z), vts = vt.length();
      const f = V(0,N,0);
      if (vts > 1e-4) f.addScaledVector(vt, -Math.min(0.6*N, vts*cB)/vts);
      Fw.add(f); Mw.add(rW.clone().cross(f));
    }
  }
  // --- ground: wheels
  const wheels = parts.filter(p=>p.type==='wheel'), nW = Math.max(1,wheels.length);
  const kW = sim.M*G/(nW*0.08), cW = 2*0.6*Math.sqrt(kW*sim.M/nW);
  for (const p of wheels){
    const axle = V(0,0,1).applyQuaternion(p.effQ).applyQuaternion(sim.q);
    const cW0 = p.o.clone().applyQuaternion(sim.q);
    const down = V(0,-1,0).addScaledVector(axle, axle.y); if (down.lengthSq() < 1e-4) continue; down.normalize();
    const rW = cW0.clone().addScaledVector(down, p.p.r);
    const y = sim.pos.y + rW.y;
    const fwd = up.clone().cross(axle); if (fwd.lengthSq()<1e-6) continue; fwd.normalize();
    const lat = fwd.clone().cross(up);
    const vp = sim.vel.clone().add(wW.clone().cross(rW));
    p.spin += vp.dot(fwd)/p.p.r*dt;
    if (y >= 0) continue;
    const N = Math.max(0, -y*kW - vp.y*cW);
    const vf = vp.dot(fwd), vl = vp.dot(lat);
    const m = p.motor && byId[p.motor];
    let Fd = m ? m.p.torque*clamp(m.out, m.p.reversible?-1:0, 1)/p.p.r : 0;
    if (m) Fd *= Math.max(0, 1 - Math.abs(vf)/(m.p.vmax||20));
    Fd = clamp(Fd, -p.p.grip*N, p.p.grip*N);
    Fd -= clamp(vf*4,-1,1)*p.p.roll*N;
    const Fl = -clamp(vl*3,-1,1)*p.p.grip*N;
    const f = V(0,N,0).addScaledVector(fwd,Fd).addScaledVector(lat,Fl);
    Fw.add(f); Mw.add(rW.clone().cross(f));
    if (p.servo && byId[p.servo]) byId[p.servo].load += Math.abs(Fl)*0.04;
  }

  // --- integrate
  sim.vel.addScaledVector(Fw, dt/sim.M);
  sim.pos.addScaledVector(sim.vel, dt);
  Mo.add(Mw.applyQuaternion(qInv));
  const Iw = sim.w.clone().applyMatrix3(sim.I);
  const wdot = Mo.sub(sim.w.clone().cross(Iw)).applyMatrix3(sim.Iinv);
  sim.w.addScaledVector(wdot, dt);
  const w = sim.w, dq = new THREE.Quaternion(w.x*dt*0.5, w.y*dt*0.5, w.z*dt*0.5, 0);
  dq.premultiply(sim.q);
  sim.q.set(sim.q.x+dq.x, sim.q.y+dq.y, sim.q.z+dq.z, sim.q.w+dq.w).normalize();
  sim.aoa = Math.atan2(-vB.y, vB.x)/DEG;
  sim.t += dt;
}

function updateMass(sim){
  const old = sim.com.clone();
  Object.assign(sim, massProps(sim.parts));
  sim.pos.add(sim.com.clone().sub(old).applyQuaternion(sim.q));
}

let craft, selId = null, partMeshes = {};

function save(){ try{ localStorage.setItem('pw.current', JSON.stringify(craft)); }catch(e){} }
function loadLib(){ try{ return JSON.parse(localStorage.getItem('pw.lib')||'{}'); }catch(e){ return {}; } }

function setCraft(c){ craft = structuredClone(c); selId=null; $('craftName').value = craft.name||''; save(); refreshBuild(true); }

function refreshBuild(full=true){
  if (full){
    craftGroup.clear(); partMeshes = {};
    for (const p of craft.parts){
      const m = new THREE.Mesh(makeGeo(p), matFor(p.color)); m.userData.id = p.id;
      if (p.type==='servo'){ const ax=new THREE.ArrowHelper(AX[p.p.axis], V(), 0.5, 0xffb020, 0.12, 0.08); m.add(ax); }
      partMeshes[p.id] = m; craftGroup.add(m);
    }
  }
  for (const p of craft.parts){ const m=partMeshes[p.id]; if(!m) continue; m.position.set(...p.pos); m.rotation.set(p.rot[0]*DEG,p.rot[1]*DEG,p.rot[2]*DEG); }
  const sm = selId && partMeshes[selId];
  if (sm) tc.attach(sm); else tc.detach();
  renderPartList(); renderProps(); renderOutputs(); updateCoM();
}

$('cadFile').onchange=async e=>{

  let geo;
  try{
    if (f.name.toLowerCase().endsWith('.stl')) geo = new STLLoader().parse(await f.arrayBuffer());
    else { const obj=new OBJLoader().parse(await f.text()); const arrs=[]; obj.traverse(o=>{ if(o.isMesh){ let g=o.geometry; if(g.index) g=g.toNonIndexed(); arrs.push(g.attributes.position.array); } });
      const n=arrs.reduce((a,b)=>a+b.length,0), all=new Float32Array(n); let off=0; for(const a of arrs){ all.set(a,off); off+=a.length; }
      geo=new THREE.BufferGeometry(); geo.setAttribute('position',new THREE.BufferAttribute(all,3)); }
  }catch(err){ alert('Could not read that file: '+err.message); return; }
  if (geo.index) geo = geo.toNonIndexed();
  geo.center(); geo.computeBoundingBox();
  const size = geo.boundingBox.getSize(V()), mx = Math.max(size.x,size.y,size.z);

};

function renderProps(){

  el.append(field('Position', [0,1,2].map(i=>numInput(p.pos[i], v=>{p.pos[i]=v; commit(false);}))));
  el.append(field('Rotation °', [0,1,2].map(i=>numInput(p.rot[i], v=>{p.rot[i]=v; commit(false);}, 5))));

    else el.append(field(FIELD_LABELS[k]||k, numInput(p.p[k], v=>{ p.p[k]=v; commit(); }, k==='thrust'||k==='torque'||k==='capacity'?10:0.05)));

    if (p.servo){ const cb=document.createElement('input'); cb.type='checkbox'; cb.checked=p.invert; cb.onchange=()=>{p.invert=cb.checked; commit(false);}; el.append(field('Invert servo', cb)); }
  }

  }

}

function dupPart(p){ const c=structuredClone(p); c.id='p'+(nextId++)+Math.random().toString(36).slice(2,6); return c; }

    const w=document.createElement('div');
    const r=document.createElement('div'); r.className='out';
    const i=document.createElement('input'); i.value=p.name; i.oninput=()=>{ p.name=i.value; save(); renderPartList(); if(p.id===selId) renderProps(); };
    i.onfocus=()=>{ if(selId!==p.id){ selId=p.id; tc.attach(partMeshes[p.id]); renderPartList(); renderProps(); } };
    r.append(i); w.append(r);
    const t=document.createElement('div'); t.className='tag'; t.style.margin='0 0 6px 4px'; t.textContent=outputInfo(p); w.append(t);
    el.append(w);
  }
}

// library
function renderLib(){
  const el=$('library'); el.innerHTML=''; const lib=loadLib();
  const presets={ 'Trainer (preset)':presetPlane, 'Jet trainer (preset)':presetJet, 'Rover (preset)':presetRover, 'Sounding rocket (preset)':presetRocket };
  for (const [n,f] of Object.entries(presets)){ const d=document.createElement('div'); d.className='item'; d.innerHTML='<span></span><span class="tag">load</span>'; d.firstChild.textContent=n; d.onclick=()=>setCraft(f()); el.append(d); }
  for (const n of Object.keys(lib)){
    const d=document.createElement('div'); d.className='item'; d.innerHTML='<span></span><span><span class="tag">load</span> <span class="tag x" style="color:var(--warn);margin-left:6px">✕</span></span>'; d.firstChild.textContent=n;
    d.onclick=e=>{ if(e.target.classList.contains('x')){ if(confirm('Delete "'+n+'" from library?')){ const l=loadLib(); delete l[n]; saveLib(l); renderLib(); } return; } setCraft(lib[n]); };
    el.append(d);
  }
}
$('craftName').oninput=()=>{ craft.name=$('craftName').value; save(); };
$('saveBtn').onclick=()=>{ const n=(craft.name||'').trim()||'Untitled'; craft.name=n; $('craftName').value=n; const l=loadLib(); l[n]=craft; if(saveLib(l)) renderLib(); };
$('newBtn').onclick=()=>setCraft({name:'New craft', parts:[]});
$('exportBtn').onclick=()=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(craft)],{type:'application/json'})); a.download=(craft.name||'craft')+'.json'; a.click(); };
$('importBtn').onclick=()=>$('importFile').click();
$('importFile').onchange=async e=>{ const f=e.target.files[0]; if(!f) return; e.target.value=''; try{ const c=JSON.parse(await f.text()); if(!Array.isArray(c.parts)) throw new Error('no parts'); setCraft(c); }catch(err){ alert('Not a craft file: '+err.message); } };

// picking
let downXY=null;
renderer.domElement.addEventListener('pointerdown', e=>{ downXY=[e.clientX,e.clientY]; });
renderer.domElement.addEventListener('pointerup', e=>{
  if (mode!=='build' || !downXY || Math.hypot(e.clientX-downXY[0], e.clientY-downXY[1])>4 || tc.dragging) return;
  const r=renderer.domElement.getBoundingClientRect();
  const ray=new THREE.Raycaster(); ray.setFromCamera(new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1), bCam);
  const hit=ray.intersectObjects(Object.values(partMeshes), false)[0];
  select(hit ? hit.object.userData.id : null);
});
addEventListener('keydown', e=>{
  if (e.target.tagName==='INPUT' && e.target.type!=='range' || e.target.tagName==='SELECT') return;
  if (mode==='build'){
    if (e.code==='KeyT') tc.setMode('translate');
    if (e.code==='KeyY') tc.setMode('rotate');
    if (e.code==='Delete'||e.code==='Backspace') delSel();
    if (e.code==='KeyD') duplicate();
  } else {
    if (e.code==='KeyR'){ resetSim(sim); setupFlyCam(); }
    if (e.code==='KeyP') paused=!paused;
  }
});

// =====================================================================
// FLY
// =====================================================================
let mode='build', sim=null, paused=false, flyMeshes=[];
function enterFly(){
  sim = createSim(craft); paused=false;
  flyGroup.clear(); flyMeshes=[];
  for (const p of sim.parts){
    const m = new THREE.Mesh(p.geo, matFor(p.color)); m.castShadow = true;
    if (p.type==='jet'||p.type==='solid'){ const len=p.type==='jet'?p.p.len:p.p.len, r=p.p.r;
      const fl=new THREE.Mesh(new THREE.ConeGeometry(r*0.7, r*6, 12).rotateZ(Math.PI/2).translate(-len/2-r*3,0,0), flameMat); fl.visible=false; m.add(fl); p.flame=fl; }
    flyGroup.add(m); flyMeshes.push([p,m]);
  }
  // sliders
  const el=$('sliders'); el.innerHTML='';
  const outs=sim.parts.filter(p=>OUTPUT_TYPES.includes(p.type));
  $('flyTitle').textContent = (craft.name||'Craft')+' — outputs';
  if (!outs.length) el.innerHTML='<span class="tag">This craft has no outputs. Add servos, motors or engines in Build.</span>';
  for (const p of outs){
    const min = p.type==='servo' || (p.type==='motor'&&p.p.reversible) ? -1 : 0;
    const w=document.createElement('div'); w.className='slider';
    w.innerHTML='<div class="lbl"><span class="n"></span><span class="v"></span></div><input type="range" step="0.01">';
    w.querySelector('.n').textContent=p.name;
    const s=w.querySelector('input'); s.min=min; s.max=1; s.value=0;
    const show=()=>{ p.out=+s.value; w.querySelector('.v').textContent = p.type==='servo' ? `${(p.out*p.p.range).toFixed(1)}°` : `${Math.round(p.out*100)}%`; };
    s.oninput=show; s.ondblclick=()=>{ s.value=0; show(); }; show();
    p.sliderEl=w; el.append(w);
  }
  setupFlyCam();
}
function setupFlyCam(){
  const fwd=V(1,0,0).applyQuaternion(sim.q);
  fOrbit.target.copy(sim.pos); fCam.position.copy(sim.pos).addScaledVector(fwd,-14).add(V(4,5,6));
  fOrbit.update(); lastTarget = sim.pos.clone();
}
let lastTarget = V();

function setMode(m){
  mode=m;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on', t.dataset.tab===m));
  const b = m==='build';
  for (const id of ['left','right','hint']) $(id).style.display = b?'':'none';
  $('flyPanel').style.display = b?'none':'block'; $('hud').style.display = b?'none':'block';
  bOrbit.enabled = b; fOrbit.enabled = !b; tc.enabled = b;
  if (!b) enterFly();
  resize();
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>setMode(t.dataset.tab));

function resize(){
  const b = mode==='build';
  const x = b ? 290 : 0, w = innerWidth - (b?580:0), h = innerHeight-44;
  renderer.domElement.style.left = x+'px';
  renderer.setSize(Math.max(100,w), h);
  for (const c of [bCam,fCam]){ c.aspect = Math.max(100,w)/h; c.updateProjectionMatrix(); }
}
addEventListener('resize', resize);

// =====================================================================
// LOOP
// =====================================================================
const DT = 1/240; let last = performance.now(), acc = 0, massTimer = 0;
function frame(now){
  const el = Math.min(0.1,(now-last)/1000); last = now;
  if (mode==='build'){ bOrbit.update(); renderer.render(bScene, bCam); }
  else if (sim){
    if (!paused){ acc += el; while (acc >= DT){ step(sim, DT); acc -= DT; } massTimer += el; if (massTimer>0.1){ updateMass(sim); massTimer=0; } }
    flyGroup.position.copy(sim.pos); flyGroup.quaternion.copy(sim.q);
    for (const [p,m] of flyMeshes){
      m.position.copy(p.o); m.quaternion.copy(p.effQ);
      if (p.type==='wheel') m.quaternion.multiply(tmpQ.setFromAxisAngle(AX.z, -p.spin));
      if (p.type==='prop') m.quaternion.multiply(tmpQ.setFromAxisAngle(AX.x, p.spin));
      if (p.flame){ p.flame.visible = p.thrustNow>0.01; p.flame.scale.set(0.4+0.6*p.thrustNow*(0.9+Math.random()*0.2),1,1); }
      if (p.sliderEl) p.sliderEl.querySelector('.n').className = 'n'+(p.overload?' warn':''), p.sliderEl.querySelector('.n').textContent = p.name + (p.overload?' ⚠ stalled':'') + (p.type==='solid' && p.out>0.5 && !p.burning && p.fuelKg<=0 ? ' (spent)':'');
    }
    // camera follows craft
    const d = sim.pos.clone().sub(lastTarget); fCam.position.add(d); fOrbit.target.copy(sim.pos); lastTarget.copy(sim.pos); fOrbit.update();
    sun.position.copy(sim.pos).add(V(300,600,200)); sun.target.position.copy(sim.pos);
    const v = sim.vel.length(), rho = atmosphere(sim.pos.y).rho;
    const e = new THREE.Euler().setFromQuaternion(sim.q,'YZX');
    let liquid=0, cap=0, solid=0; for (const p of sim.parts){ if(p.type==='tank'){liquid+=p.fuelKg;cap+=p.p.capacity;} if(p.type==='solid') solid+=p.fuelKg; }
    $('hud').textContent =
`IAS     ${(v*Math.sqrt(rho/1.225)*1.944).toFixed(0)} kt  (${v.toFixed(1)} m/s)
ALT     ${sim.pos.y.toFixed(1)} m
V/S     ${sim.vel.y.toFixed(1)} m/s
PITCH   ${(e.z/DEG).toFixed(1)}°   BANK ${(-e.x/DEG).toFixed(1)}°
HDG     ${(((-e.y/DEG)%360)+360)%360|0}°
AoA     ${v>2?sim.aoa.toFixed(1):'—'}°
MASS    ${sim.M.toFixed(1)} kg${cap?`\nFUEL    ${liquid.toFixed(1)} / ${cap} kg`:''}${solid||sim.parts.some(p=>p.type==='solid')?`\nSOLID   ${solid.toFixed(2)} kg`:''}
TIME    ${sim.t.toFixed(1)} s${sim.stalled&&sim.pos.y>3?'\n\n⚠ STALL':''}${paused?'\n\nPAUSED':''}`;
    renderer.render(fScene, fCam);
  }
  requestAnimationFrame(frame);
}

// init
let initial; try{ initial = JSON.parse(localStorage.getItem('pw.current')); }catch(e){}
setCraft(initial && Array.isArray(initial.parts) ? initial : presetPlane());
renderLib(); resize(); requestAnimationFrame(frame);
window.__pw = { get sim(){return sim;}, get craft(){return craft;}, run(sec){ for(let i=0;i<sec/DT;i++){ step(sim,DT); if(i%24===0) updateMass(sim); } }, setMode, setCraft, presetPlane, presetRocket, presetRover, presetJet };
</script>
</body>
</html>
