<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Interceptor 3D</title>
<style>
  :root { --bg:#05070d; --fg:#cfe3ff; --accent:#4cf; }
  html,body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--fg); font:13px/1.4 ui-monospace,Menlo,monospace; }
  #hud { position:fixed; top:12px; left:16px; pointer-events:none; text-shadow:0 0 4px #000; }
  #hud b { color:var(--accent); }
  #help { position:fixed; bottom:12px; left:16px; opacity:.75; pointer-events:none; }
  #over { position:fixed; inset:0; display:none; align-items:center; justify-content:center; flex-direction:column; background:#000a; font-size:20px; }
  #over button { margin-top:14px; font:inherit; padding:8px 18px; background:var(--accent); border:0; border-radius:6px; cursor:pointer; }
</style>
</head>
<body>
<div id="hud"></div>
<div id="help">Click a threat (red) to launch an interceptor · Space: auto-defend toggle · Drag: orbit · Wheel: zoom</div>
<div id="over"><div id="overMsg"></div><button onclick="restart()">Play again</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<script>
const W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(devicePixelRatio); renderer.setSize(W, H);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x05070d, 600, 2200);
const camera = new THREE.PerspectiveCamera(55, W/H, 1, 5000);

scene.add(new THREE.HemisphereLight(0x8fb4ff, 0x203018, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 0.8); sun.position.set(300,500,200); scene.add(sun);

// Ground + grid
const ground = new THREE.Mesh(new THREE.CircleGeometry(1600, 64), new THREE.MeshLambertMaterial({ color:0x13221a }));
ground.rotation.x = -Math.PI/2; scene.add(ground);
const grid = new THREE.GridHelper(3200, 64, 0x1f4d3a, 0x16302a); grid.position.y = 0.2; scene.add(grid);

// Stars
{ const g = new THREE.BufferGeometry(), p = [];
  for (let i=0;i<1500;i++){ const v=new THREE.Vector3().randomDirection().multiplyScalar(2500); if (v.y<0) v.y=-v.y; p.push(v.x,v.y,v.z); }
  g.setAttribute('position', new THREE.Float32BufferAttribute(p,3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color:0xffffff, size:2, fog:false }))); }

// City blocks (defended assets)
const cities = [];
for (let i=0;i<6;i++){
  const a = i/6*Math.PI*2 + .3, r = 140 + (i%2)*60;
  const grp = new THREE.Group(); grp.position.set(Math.cos(a)*r, 0, Math.sin(a)*r);
  for (let j=0;j<7;j++){
    const h = 8+Math.random()*30;
    const b = new THREE.Mesh(new THREE.BoxGeometry(8,h,8), new THREE.MeshLambertMaterial({ color:0x5a6f8f, emissive:0x111a2a }));
    b.position.set((Math.random()-.5)*36, h/2, (Math.random()-.5)*36); grp.add(b);
  }
  scene.add(grp); cities.push({ grp, alive:true });
}

// Launcher at center
const launcher = new THREE.Group();
launcher.add(new THREE.Mesh(new THREE.CylinderGeometry(14,18,8,16), new THREE.MeshLambertMaterial({ color:0x445 })));
const radar = new THREE.Mesh(new THREE.BoxGeometry(18,12,2), new THREE.MeshLambertMaterial({ color:0x8ac, emissive:0x113 }));
radar.position.y = 14; launcher.add(radar);
scene.add(launcher);
const LAUNCH = new THREE.Vector3(0, 10, 0);

// Simple orbit camera
let camYaw = .8, camPitch = .45, camDist = 900, dragging = false, moved = false, lx=0, ly=0;
function updateCam(){
  camera.position.set(Math.cos(camYaw)*Math.cos(camPitch)*camDist, Math.sin(camPitch)*camDist, Math.sin(camYaw)*Math.cos(camPitch)*camDist);
  camera.lookAt(0, 150, 0);
}
addEventListener('pointerdown', e => { dragging = true; moved = false; lx=e.clientX; ly=e.clientY; });
addEventListener('pointermove', e => { if(!dragging) return; const dx=e.clientX-lx, dy=e.clientY-ly; if (Math.abs(dx)+Math.abs(dy)>3) moved=true;
  camYaw += dx*.005; camPitch = Math.min(1.45, Math.max(.05, camPitch+dy*.005)); lx=e.clientX; ly=e.clientY; });
addEventListener('pointerup', e => { dragging=false; if(!moved) pick(e); });
addEventListener('wheel', e => { camDist = Math.min(2000, Math.max(250, camDist*(1+e.deltaY*.001))); });
addEventListener('resize', () => { camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

// Entities
const G = 30; // gravity m/s²
let threats = [], interceptors = [], blasts = [], trails = [];
let score, missed, ammo, wave, spawnTimer, waveLeft, auto, gameOver;

const threatGeo = new THREE.ConeGeometry(3, 14, 8); threatGeo.rotateX(Math.PI/2);
const intGeo = new THREE.ConeGeometry(2, 10, 8); intGeo.rotateX(Math.PI/2);

function spawnThreat(){
  const targets = cities.filter(c=>c.alive); if(!targets.length) return;
  const tgt = targets[Math.floor(Math.random()*targets.length)].grp.position.clone();
  const a = Math.random()*Math.PI*2, start = new THREE.Vector3(Math.cos(a)*1400, 600+Math.random()*300, Math.sin(a)*1400);
  // Ballistic arc: choose flight time T, solve velocity
  const T = 14 - Math.min(6, wave*.6) + Math.random()*3;
  const vel = tgt.clone().sub(start).divideScalar(T); vel.y += .5*G*T;
  const mesh = new THREE.Mesh(threatGeo, new THREE.MeshBasicMaterial({ color:0xff3344 }));
  mesh.position.copy(start); scene.add(mesh);
  threats.push({ mesh, vel, trail: makeTrail(0xff5544), targeted:false });
}

function makeTrail(color){
  const n = 60, geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(new Float32Array(n*3),3));
  geo.setDrawRange(0,0);
  const line = new THREE.Line(geo, new THREE.LineBasicMaterial({ color, transparent:true, opacity:.6 }));
  scene.add(line); const t = { line, pts:[], n }; trails.push(t); return t;
}
function pushTrail(t, p){
  t.pts.push(p.x,p.y,p.z); if (t.pts.length > t.n*3) t.pts.splice(0,3);
  const arr = t.line.geometry.attributes.position.array; arr.set(t.pts);
  t.line.geometry.attributes.position.needsUpdate = true; t.line.geometry.setDrawRange(0, t.pts.length/3);
}
function fadeTrail(t){ t.dying = 1; }

function launchAt(th){
  if (ammo <= 0 || !th) return;
  ammo--; th.targeted = true;
  const mesh = new THREE.Mesh(intGeo, new THREE.MeshBasicMaterial({ color:0x44ccff }));
  mesh.position.copy(LAUNCH); scene.add(mesh);
  interceptors.push({ mesh, vel:new THREE.Vector3(0,120,0), target:th, life:12, trail:makeTrail(0x66ddff) });
}

// Proportional navigation guidance
const N = 4, MAXA = 400, SPEED_GAIN = 260;
function guide(it, dt){
  const th = it.target;
  if (!th || th.dead){ // retarget nearest
    it.target = threats.filter(t=>!t.dead).sort((a,b)=>a.mesh.position.distanceTo(it.mesh.position)-b.mesh.position.distanceTo(it.mesh.position))[0];
    if(!it.target) return;
  }
  const R = it.target.mesh.position.clone().sub(it.mesh.position);
  const Vr = it.target.vel.clone().sub(it.vel);
  const r2 = R.lengthSq();
  const omega = R.clone().cross(Vr).divideScalar(r2);         // LOS rate
  const closing = -R.dot(Vr)/Math.sqrt(r2);
  let acc = it.vel.clone().normalize().cross(omega).multiplyScalar(-N*Math.max(closing,50));
  acc.add(R.clone().normalize().multiplyScalar(SPEED_GAIN));  // boost toward target
  acc.y += G;                                                // gravity compensation
  if (acc.length() > MAXA) acc.setLength(MAXA);
  it.vel.addScaledVector(acc, dt);
  if (it.vel.length() > 650) it.vel.setLength(650);
}

function explode(pos, color, size){
  const m = new THREE.Mesh(new THREE.SphereGeometry(1,16,12), new THREE.MeshBasicMaterial({ color, transparent:true }));
  m.position.copy(pos); scene.add(m);
  const light = new THREE.PointLight(color, 3, size*8); light.position.copy(pos); scene.add(light);
  blasts.push({ m, light, t:0, size });
}

function pick(e){
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(e.clientX/innerWidth*2-1, -e.clientY/innerHeight*2+1);
  ray.setFromCamera(ndc, camera);
  // nearest threat to the ray, generous tolerance
  let best=null, bd=Infinity;
  for (const t of threats){ if(t.dead) continue;
    const d = ray.ray.distanceToPoint(t.mesh.position) / camera.position.distanceTo(t.mesh.position);
    if (d < .05 && d < bd){ bd=d; best=t; } }
  launchAt(best);
}
addEventListener('keydown', e => { if (e.code==='Space'){ auto=!auto; e.preventDefault(); } });

function restart(){
  for (const o of [...threats, ...interceptors]) scene.remove(o.mesh);
  for (const t of trails) scene.remove(t.line);
  for (const b of blasts){ scene.remove(b.m); scene.remove(b.light); }
  threats=[]; interceptors=[]; blasts=[]; trails=[];
  cities.forEach(c=>{ c.alive=true; c.grp.visible=true; });
  score=0; missed=0; ammo=30; wave=1; spawnTimer=2; waveLeft=6; auto=false; gameOver=false;
  document.getElementById('over').style.display='none';
}

function step(dt){
  if (gameOver) return;
  spawnTimer -= dt;
  if (spawnTimer <= 0 && waveLeft > 0){ spawnThreat(); waveLeft--; spawnTimer = Math.max(.6, 3 - wave*.25)*(0.5+Math.random()); }
  if (waveLeft === 0 && threats.every(t=>t.dead)){ wave++; waveLeft = 5+wave*2; ammo += 15 + wave*2; spawnTimer = 3; }

  if (auto){ for (const t of threats) if (!t.dead && !t.targeted && t.mesh.position.y < 900) { launchAt(t); break; } }

  for (const t of threats){ if (t.dead) continue;
    t.vel.y -= G*dt; t.mesh.position.addScaledVector(t.vel, dt);
    t.mesh.lookAt(t.mesh.position.clone().add(t.vel)); pushTrail(t.trail, t.mesh.position);
    if (t.mesh.position.y <= 0){
      t.dead = true; scene.remove(t.mesh); fadeTrail(t.trail); missed++;
      explode(t.mesh.position, 0xff7722, 50);
      for (const c of cities) if (c.alive && c.grp.position.distanceTo(t.mesh.position.clone().setY(0)) < 45){ c.alive=false; c.grp.visible=false; }
    }
  }
  for (const it of interceptors){ if (it.dead) continue;
    guide(it, dt); it.mesh.position.addScaledVector(it.vel, dt); it.life -= dt;
    it.mesh.lookAt(it.mesh.position.clone().add(it.vel)); pushTrail(it.trail, it.mesh.position);
    const th = it.target;
    if (th && !th.dead && it.mesh.position.distanceTo(th.mesh.position) < 12){
      th.dead = it.dead = true; scene.remove(th.mesh); scene.remove(it.mesh); fadeTrail(th.trail); fadeTrail(it.trail);
      explode(th.mesh.position, 0xffee88, 30); score++;
    } else if (it.life <= 0 || it.mesh.position.y < 0){
      it.dead = true; scene.remove(it.mesh); fadeTrail(it.trail); if (th) th.targeted=false;
      explode(it.mesh.position, 0x88aaff, 12);
    }
  }
  threats = threats.filter(t=>!t.dead); interceptors = interceptors.filter(i=>!i.dead);

  if (!cities.some(c=>c.alive)){ gameOver = true;
    document.getElementById('overMsg').innerHTML = `All cities lost<br>Wave ${wave} · ${score} intercepts`;
    document.getElementById('over').style.display='flex'; }
}

function animateFx(dt){
  for (const b of blasts){ b.t += dt; const k = b.t/1.2;
    b.m.scale.setScalar(b.size*Math.min(1,k*3)); b.m.material.opacity = 1-k; b.light.intensity = 3*(1-k); }
  blasts = blasts.filter(b => { if (b.t>1.2){ scene.remove(b.m); scene.remove(b.light); return false; } return true; });
  for (const t of trails) if (t.dying){ t.dying -= dt*.4; t.line.material.opacity = .6*Math.max(0,t.dying); }
  trails = trails.filter(t => { if (t.dying!==undefined && t.dying<=0){ scene.remove(t.line); return false; } return true; });
  radar.rotation.y += dt*1.5;
}

function hud(){
  document.getElementById('hud').innerHTML =
    `WAVE <b>${wave}</b> · INTERCEPTS <b>${score}</b> · IMPACTS <b>${missed}</b><br>`+
    `INTERCEPTORS <b>${ammo}</b> · CITIES <b>${cities.filter(c=>c.alive).length}/6</b> · AUTO <b>${auto?'ON':'OFF'}</b><br>`+
    `TRACKS <b>${threats.length}</b> · IN FLIGHT <b>${interceptors.length}</b>`;
}

restart();
let last = performance.now();
function loop(now){
  const dt = Math.min(.05, (now-last)/1000); last = now;
  step(dt); animateFx(dt); updateCam(); hud();
  renderer.render(scene, camera); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
